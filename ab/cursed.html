<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>被诅咒的宝藏</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;overflow:hidden;touch-action:none;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;background:#1a1a2e}
#top{position:fixed;top:0;left:0;right:0;height:48px;z-index:100;display:flex;align-items:center;gap:8px;padding:0 8px;background:rgba(20,20,40,.9)}
#top .btn{height:34px;border:0;border-radius:17px;padding:0 14px;background:rgba(255,255,255,.92);color:#222;font-size:14px;font-weight:800;cursor:pointer;box-shadow:0 2px 0 rgba(0,0,0,.15)}
#top .btn:active{transform:translateY(1px)}
#top .t{color:#ffd93d;font-size:16px;font-weight:800;flex:1;text-align:center}
#stage{position:fixed;top:48px;left:0;right:0;bottom:0;background:#1a1a2e;display:flex;align-items:center;justify-content:center}
#stage ruffle-player{width:100%;height:100%}
#loading{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:radial-gradient(circle at 50% 40%,#3a2f5e 0%,#1a1a2e 70%);z-index:50;color:#ffd93d;font-size:18px;font-weight:800}
#loading .gem{font-size:64px;animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.2)}}
#err{position:fixed;inset:0;z-index:200;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:rgba(10,10,20,.96);color:#ffd93d;font-size:16px;text-align:center}
#err .btn{height:36px;border:0;border-radius:18px;padding:0 18px;background:#ffd93d;color:#222;font-size:14px;font-weight:800;cursor:pointer}
</style></head><body>
<div id="top"><button class="btn" id="btnBack">← 主页</button><div class="t">💎 被诅咒的宝藏</div><button class="btn" id="btnFull">⛶ 全屏</button></div>
<div id="stage"><div id="loading"><div class="gem">💎</div><div>加载中…</div></div></div>
<div id="err">Ruffle 加载失败<br><button class="btn" onclick="location.reload()">重试</button></div>
<script>
function showErr(t){document.getElementById('loading').style.display='none';var e=document.getElementById('err');e.style.display='flex';if(t)e.innerHTML='<div style="padding:0 20px">'+t+'</div><button class="btn" onclick="location.reload()">重试</button>';}
document.getElementById('btnBack').onclick=function(){location.href='main.html';};
document.getElementById('btnFull').onclick=function(){var el=document.getElementById('stage');if(el.requestFullscreen)el.requestFullscreen();};
window.addEventListener('error',function(){showErr('');});
/* 同目录自托管 Ruffle，0 外链（与愤怒小鸟同套）*/
var s=document.createElement('script');
s.src='ruffle.js';
s.onload=function(){
  window.RufflePlayer=window.RufflePlayer||{};
  window.RufflePlayer.config={autoplay:'on',unmountOverlay:'hidden',letterbox:'off',allowScriptAccess:false};
  var ruffle=window.RufflePlayer.newest();
  if(!ruffle){showErr('Ruffle 初始化失败，请更新浏览器');return;}
  var player=ruffle.createPlayer();
  player.style.width='100%';player.style.height='100%';
  document.getElementById('stage').appendChild(player);
  player.load('cursed-treasure-1.swf').then(function(){
    document.getElementById('loading').style.display='none';
  }).catch(function(e){showErr('SWF 加载失败：'+(e&&e.message?e.message:e));});
};
s.onerror=function(){showErr('Ruffle 脚本加载失败');};
document.head.appendChild(s);
</script>
</body></html>
