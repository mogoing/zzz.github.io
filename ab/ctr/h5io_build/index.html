    <style>
        :root {
            --primary-glow: rgba(255, 69, 0, 0.6);
            --bg-color: #0a0a0a;
            --accent-color: #ff4500;
            --text-color: #ffffff;
            --warning-red: #ff0000;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body,
        html {
            height: 100%;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Ambient background effect */
        .background-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, #1a0a0a 0%, #000 100%);
            z-index: -1;
        }

        .background-glow {
            position: fixed;
            bottom: -10%;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            height: 40%;
            background: radial-gradient(ellipse at center, var(--primary-glow) 0%, transparent 70%);
            filter: blur(50px);
            opacity: 0.4;
            z-index: -1;
        }

        /* Container for the splash screen content */
        .splash-container {
            width: 100%;
            max-width: 500px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 2rem 1rem;
            text-align: center;
            position: relative;
        }

        /* Top: Logo Section */
        .logo-section {
            width: 100%;
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            animation: fadeInDown 1.2s ease-out;
        }

        .game-logo {
            max-width: 85%;
            max-height: 120px;
            object-fit: contain;
            filter: drop-shadow(0 0 10px rgba(255, 69, 0, 0.3));
        }

        /* CSS Fallback Logo Style */
        .logo-fallback {
            display: none;
            font-weight: 900;
            font-size: 2.5rem;
            text-transform: uppercase;
            color: var(--accent-color);
            text-shadow: 0 0 10px var(--accent-color), 2px 2px 0px #000;
            letter-spacing: -1px;
            line-height: 1;
        }

        /* Middle: Character Section */
        .character-section {
            flex: 2;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            width: 100%;
        }

        .character-image {
            max-width: 90%;
            max-height: 45vh;
            object-fit: contain;
            animation: float 4s ease-in-out infinite;
            filter: drop-shadow(0 15px 25px rgba(0, 0, 0, 0.8));
        }

        /* CSS/SVG Fallback Character */
        .character-fallback {
            display: none;
            width: 200px;
            height: 200px;
            animation: float 4s ease-in-out infinite;
        }

        /* Bottom: Action Section */
        .action-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            animation: fadeInUp 1s ease-out 0.5s both;
        }

        .play-button {
            background: linear-gradient(180deg, #ff6a00 0%, #e63900 100%);
            color: white;
            border: none;
            padding: 18px 50px;
            font-size: 1.5rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 20px var(--primary-glow), 0 5px 0 #802000;
            transition: all 0.2s ease;
            position: relative;
            overflow: hidden;
            animation: pulse 2s infinite;
        }

        .play-button:active {
            transform: translateY(4px);
            box-shadow: 0 0 10px var(--primary-glow), 0 1px 0 #802000;
        }

        .version-tag {
            margin-top: 1.5rem;
            font-size: 0.75rem;
            opacity: 0.5;
            letter-spacing: 1px;
        }

        /* State management for missing images */
        .img-failed .game-logo,
        .img-failed .character-image {
            display: none;
        }

        .img-failed .logo-fallback,
        .img-failed .character-fallback {
            display: block;
        }

        /* Animations */
        @keyframes float {

            0%,
            100% {
                transform: translateY(0) rotate(0deg);
            }

            50% {
                transform: translateY(-20px) rotate(2deg);
            }
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
                box-shadow: 0 0 15px var(--primary-glow);
            }

            50% {
                transform: scale(1.05);
                box-shadow: 0 0 30px var(--accent-color);
            }

            100% {
                transform: scale(1);
                box-shadow: 0 0 15px var(--primary-glow);
            }
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
