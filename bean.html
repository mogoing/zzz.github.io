<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>莫古菜园</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#7fae62;font-family:'Microsoft YaHei','PingFang SC',sans-serif;user-select:none}
#app{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
.screen{position:relative;aspect-ratio:13.5/9;width:min(100vw,calc(100vh*1.5));background:#9ccc7e;border-radius:14px;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.farm{position:absolute;left:0;top:0;width:100%;height:72%;background:url(bean/img/farm_bg.jpg) center/cover no-repeat}
.farm::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,0) 60%,rgba(0,0,0,.15))}
.top{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;justify-content:space-between;padding:1.2% 2%;z-index:5;pointer-events:none}
.top>*{pointer-events:auto}
.logo{font-size:clamp(14px,2vw,22px);font-weight:900;color:#5b3a1e;text-shadow:0 1px 0 rgba(255,255,255,.6);background:rgba(255,248,225,.85);padding:.3em .7em;border-radius:999px;border:2px solid #c89b5a}
.coins{display:flex;align-items:center;gap:5px;font-size:clamp(13px,1.8vw,20px);font-weight:800;color:#7a4d00;background:linear-gradient(#ffe9a8,#ffd06b);padding:.3em .7em;border-radius:999px;border:2px solid #d9a741;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.field{position:absolute;left:3.5%;top:7%;width:56%;height:80%;display:grid;grid-template-columns:repeat(4,1fr);align-content:space-evenly;z-index:3}
.plot{position:relative;aspect-ratio:1;cursor:pointer;transition:transform .15s}
.plot img.dia{width:100%;height:100%;display:block}
.plot:nth-child(n+5):nth-child(-n+8),.plot:nth-child(n+13):nth-child(-n+16){transform:translateX(7%)}
.plot:active{transform:scale(.94)}
.crop{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
.crop img{width:62%;filter:drop-shadow(0 2px 3px rgba(0,0,0,.25))}
.stage{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:clamp(11px,1.5vw,17px);font-weight:800;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.5);background:rgba(0,0,0,.45);padding:.2em .5em;border-radius:8px;white-space:nowrap;pointer-events:none}
.done{position:absolute;right:2%;top:2%;background:#ffd93d;color:#7a4d00;font-size:clamp(10px,1.4vw,15px);font-weight:900;padding:.15em .5em;border-radius:999px;border:2px solid #fff;box-shadow:0 2px 5px rgba(0,0,0,.3);pointer-events:none;transform:rotate(6deg)}
.weed{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:clamp(13px,2vw,22px);pointer-events:none;transform:rotate(-8deg)}
.side{position:absolute;right:1.5%;top:12%;display:flex;flex-direction:column;gap:1.5vh;z-index:5}
.side button{font-size:clamp(12px,1.7vw,19px);font-weight:800;color:#fff;padding:.55em .9em;border:none;border-radius:14px;cursor:pointer;box-shadow:0 3px 8px rgba(0,0,0,.25);border:2px solid rgba(255,255,255,.5)}
.side .b1{background:linear-gradient(#ff8a5c,#ff6b3d)}
.side .b2{background:linear-gradient(#5aa7ff,#3f7fff)}
.side .b3{background:linear-gradient(#7ed06a,#4da83a)}
.tabbar{position:absolute;left:0;right:0;bottom:0;height:28%;background:linear-gradient(#f7e9c8,#eed9a7);border-top:3px solid #c89b5a;display:flex;flex-direction:column;z-index:6}
.tabs{display:flex;height:30%;border-bottom:2px solid #d8b97a}
.tabs span{flex:1;display:flex;align-items:center;justify-content:center;font-size:clamp(13px,1.8vw,20px);font-weight:800;color:#6b4a22;cursor:pointer;border-right:1px solid #d8b97a}
.tabs span.on{background:linear-gradient(#ffe9a8,#ffd06b);color:#7a4d00}
.tabs span:last-child{border-right:none}
.seedbar{flex:1;display:flex;align-items:center;gap:1.2%;padding:1% 2%;overflow-x:auto;scrollbar-width:none}
.seedbar::-webkit-scrollbar{display:none}
.seed{position:relative;flex:0 0 15.5%;height:92%;background:linear-gradient(#fffdf0,#f7ecd0);border:2px solid #c89b5a;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:space-evenly;cursor:pointer;box-shadow:0 2px 5px rgba(0,0,0,.15);transition:transform .12s}
.seed:active{transform:scale(.94)}
.seed img{width:76%;object-fit:contain;filter:drop-shadow(0 2px 2px rgba(0,0,0,.2))}
.seed .nm{font-size:clamp(10px,1.4vw,15px);font-weight:800;color:#5b3a1e}
.seed .pr{font-size:clamp(9px,1.2vw,13px);color:#b3541e;font-weight:700}
.seed .cnt{position:absolute;right:6%;top:6%;background:#ff6b3d;color:#fff;font-size:clamp(9px,1.2vw,13px);font-weight:800;min-width:1.4em;text-align:center;border-radius:999px;padding:.1em .3em}
.mask{position:absolute;inset:0;background:rgba(0,0,0,.5);z-index:10;display:none;align-items:center;justify-content:center}
.mask.show{display:flex}
.shop{width:86%;max-width:680px;background:linear-gradient(#8a5a2b,#6b3f1d);border:5px solid #4a2a10;border-radius:18px;padding:2.5%;display:flex;flex-direction:column;max-height:88%}
.shop h2{text-align:center;color:#ffe9a8;font-size:clamp(16px,2.4vw,26px);text-shadow:0 2px 0 #4a2a10;margin-bottom:2%}
.shop .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2.5%;overflow-y:auto;scrollbar-width:none}
.scard{background:linear-gradient(#fffdf0,#f2e2bd);border:3px solid #c89b5a;border-radius:12px;display:flex;flex-direction:column;align-items:center;padding:4% 2%;cursor:pointer}
.scard img{width:70%;object-fit:contain}
.scard .n{font-size:clamp(12px,1.7vw,18px);font-weight:800;color:#5b3a1e}
.scard .t{font-size:clamp(9px,1.2vw,13px);color:#8a6a3f}
.scard .p{font-size:clamp(11px,1.5vw,16px);color:#c4451c;font-weight:800;margin-top:2%}
.scard .go{margin-top:2%;background:linear-gradient(#ffd06b,#ff9d3d);color:#7a4d00;font-weight:800;font-size:clamp(10px,1.4vw,15px);padding:.25em .9em;border-radius:999px;border:2px solid #fff}
.shop .close{align-self:center;margin-top:2.5%;background:linear-gradient(#ff8a5c,#ff6b3d);color:#fff;font-size:clamp(13px,1.8vw,19px);font-weight:800;padding:.35em 1.6em;border:none;border-radius:999px;cursor:pointer}
.toast{position:absolute;left:50%;bottom:32%;transform:translateX(-50%);background:rgba(0,0,0,.78);color:#fff;font-size:clamp(12px,1.7vw,19px);padding:.5em 1.2em;border-radius:12px;z-index:20;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}
.weather{position:absolute;left:2%;bottom:2%;font-size:clamp(11px,1.5vw,16px);color:#3d5a2a;font-weight:700;background:rgba(255,255,255,.75);padding:.2em .6em;border-radius:999px;z-index:4;pointer-events:none}
.hint{position:absolute;left:50%;top:44%;transform:translateX(-50%);font-size:clamp(11px,1.5vw,16px);color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.5);background:rgba(0,0,0,.4);padding:.3em 1em;border-radius:999px;z-index:4;pointer-events:none}
@media (max-width:600px){.side .b2{display:none}.side button{min-width:84px;min-height:48px;font-size:15px}.side{right:1%;gap:2vh}.tabs span{font-size:15px}.seed .nm{font-size:12px}.seed .pr{font-size:11px}}
</style>
</head>
<body>
<div id="app"><div class="screen">
  <div class="farm">
    <div class="top">
      <div class="logo">莫古菜园</div>
      <div class="coins"><i>💰</i><span id="coin">0</span></div>
    </div>
    <div class="field" id="field"></div>
    <div class="hint">点绿色地块开垦 · 播种 · 收获</div>
    <div class="side">
      <button class="b1" onclick="openShop()">🏪 商店</button>
      <button class="b2" onclick="location.href='main.html'">↩ 返回</button>
      <button class="b3" onclick="togglePause()">⏸ 暂停</button>
    </div>
    <div class="weather" id="weather">🌤 晴天</div>
  </div>
  <div class="tabbar">
    <div class="tabs">
      <span class="on" onclick="tab(0)">种子</span>
      <span onclick="tab(1)">农作物</span>
      <span onclick="tab(2)">特殊</span>
      <span onclick="tab(3)">装扮</span>
    </div>
    <div class="seedbar" id="seedbar"></div>
  </div>
  <div class="mask" id="shop">
    <div class="shop">
      <h2>🏪 种子商店</h2>
      <div class="grid" id="shopgrid"></div>
      <button class="close" onclick="closeShop()">关 闭</button>
    </div>
  </div>
  <div class="toast" id="toast"></div>
</div></div>
<script>
'use strict';
var CROPS={
 apple:{n:'苹果',seedUnit:2,seedPrice:1,price:1,growH:2,base:2},
 pear:{n:'梨',seedUnit:2,seedPrice:1,price:1,growH:3,base:2},
 corn:{n:'玉米',seedUnit:1,seedPrice:1,price:3,growH:3,base:2},
 pumpkin:{n:'南瓜',seedUnit:1,seedPrice:3,price:8,growH:6,base:1},
 strawberry:{n:'草莓',seedUnit:1,seedPrice:2,price:5,growH:4,base:2},
 carrot:{n:'胡萝卜',seedUnit:1,seedPrice:1,price:2,growH:2,base:2}
};
var ORDER=['apple','pear','corn','pumpkin','strawberry','carrot'];
var IMG='bean/img/';
var SEEDIMG='bean/img/seed/';
var PLOTS=16,GROW_DAYS=0.25,DIG_BASE=10,DIG_STEP=2;
var API='https://api.mogoing.xyz';
var U=localStorage.getItem('blindbox_user')||'';
var P=localStorage.getItem('blindbox_pass')||'';
var coins=0,state={p:[],seed:{},sel:null,tab:0,dig:0};
var weather='晴',paused=false,timer=null;
function daySeed(){var d=new Date();return (d.getFullYear()*372+d.getMonth()*31+d.getDate())%1000}
function todayPrice(c){var s=CROPS[c];var r=((daySeed()*7+ORDER.indexOf(c)*13)%100)/100;var v=s.price*(0.85+r*0.6);if(weather.indexOf('雨')>=0)v*=1.2;return Math.max(1,Math.round(v))}
function digCost(n){return DIG_BASE+n*DIG_STEP}
function save(){localStorage.setItem('bean_save',JSON.stringify({p:state.p,seed:state.seed,dig:state.dig}));apiSave()}
function load(){try{var s=JSON.parse(localStorage.getItem('bean_save'));if(s){if(Array.isArray(s.p)&&s.p.length&&s.p[0]&&('st'in s.p[0])){state={p:[],seed:{},dig:0}}else{state.p=s.p;state.seed=s.seed||{};state.dig=s.dig||0}}}catch(e){}}
function api(url,body){return fetch(API+url,{method:body?'POST':'GET',headers:{'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined}).then(function(r){return r.json()}).catch(function(){return null})}
function getCoins(){api('/api/coins?u='+U+'&p='+P).then(function(j){if(j&&j.ok){coins=j.coins||0;document.getElementById('coin').textContent=coins}})}
function apiSave(){api('/api/save',{u:U,p:P,game:'bean',data:{p:state.p,seed:state.seed,dig:state.dig}})}
function setCoins(delta){return api(delta>0?'/api/gain':'/api/spend',{u:U,p:P,amount:Math.abs(delta)}).then(function(j){if(j&&j.ok){coins=j.coins;document.getElementById('coin').textContent=coins;return true}toast('金币不足');return false})}
function plotHTML(i){var pl=state.p[i]||{};var owned=state.dig>i;
 var img=owned?'diamond_soil.png':'diamond_grass.png';var inner='';
 if(pl.crop){
  var c=pl.crop;
  var st=stageOf(pl);
  if(pl.weed)inner='<div class="weed">🌿</div>';
  else if(st>=5)inner='<div class="done">可摘!</div><div class="crop"><img src="'+IMG+c+'_s4.webp"></div>';
  else inner='<div class="crop"><img src="'+IMG+c+'_s'+Math.max(1,Math.min(3,Math.floor(st)))+'.webp"></div>';
 }else if(owned&&!pl.crop){inner='<div class="stage">+ 播种</div>'}
 return '<div class="plot" data-i="'+i+'" onclick="tapPlot('+i+')"><img class="dia" src="'+IMG+img+'">'+inner+'</div>'}
function stageOf(pl){if(!pl.crop||pl.weed)return 0;var h=(Date.now()-pl.t)/3.6e6;var g=CROPS[pl.crop].growH;return Math.min(5,h/g*5)}
function render(){var h='';for(var i=0;i<PLOTS;i++)h+=plotHTML(i);document.getElementById('field').innerHTML=h}
function renderSeed(){var el=document.getElementById('seedbar');var h='';ORDER.forEach(function(c){var s=CROPS[c];h+='<div class="seed" onclick="buySeed(\''+c+'\')"><img src="'+SEEDIMG+c+'_seed.png"><div class="nm">'+s.n+'</div><div class="pr">'+todayPrice(c)+'金/'+s.seedUnit+'个</div><div class="cnt">'+(state.seed[c]||0)+'</div></div>'});el.innerHTML=h}
function renderShop(){var el=document.getElementById('shopgrid');var h='';ORDER.forEach(function(c){var s=CROPS[c];h+='<div class="scard" onclick="buySeed(\''+c+'\')"><img src="'+SEEDIMG+c+'_seed.png"><div class="n">'+s.n+'</div><div class="t">成熟约'+s.growH+'小时</div><div class="p">'+todayPrice(c)+' 金/'+s.seedUnit+'个</div><div class="go">购买</div></div>'});el.innerHTML=h}
function tapPlot(i){
 var pl=state.p[i]||{};
 if(pl.crop&&!pl.weed&&stageOf(pl)>=5){harvest(i);return}
 if(!state.p[i])state.p[i]={};
 var owned=state.dig>i;
 if(!owned){dig(i);return}
 if(pl.weed){delete pl.weed;pl.crop=null;save();render();toast('长草清掉了，可重新开垦');return}
 if(!pl.crop){
  var sel=state.sel;
  if(!sel){toast('先到下方点种子卡购买并选中');return}
  var s=CROPS[sel];
  if((state.seed[sel]||0)<s.seedUnit){toast('种子不够啦，先买');return}
  state.seed[sel]-=s.seedUnit;pl.crop=sel;pl.t=Date.now();pl.fer=0;save();render();renderSeed();toast('种下'+s.n+'！')
 }else{
  if(stageOf(pl)<5){fertilize(i)}
 }
}
function dig(i){var c=digCost(state.dig);toast('开垦第'+(state.dig+1)+'块需 '+c+' 金币');setCoins(-c).then(function(ok){if(ok){state.dig++;save();render();toast('开垦成功！')}})}
function fertilize(i){var pl=state.p[i];pl.fer=(pl.fer||0)+1;save();render();toast('施肥+1，产量提高')}
function harvest(i){var pl=state.p[i];var c=pl.crop;var s=CROPS[c];var y=s.base+(pl.fer||0)*s.base;setCoins(todayPrice(c)*y).then(function(ok){if(ok){delete state.p[i].crop;delete state.p[i].t;delete state.p[i].fer;save();render();toast('收获'+s.n+'×'+y+'！')}})}
function buySeed(c){var s=CROPS[c];var pr=todayPrice(c);setCoins(-pr).then(function(ok){if(ok){state.seed[c]=(state.seed[c]||0)+s.seedUnit;state.sel=c;save();renderSeed();renderShop();toast('买了'+s.seedUnit+'个'+s.n+'种子')}})}
function tab(n){state.tab=n;var ts=document.querySelectorAll('.tabs span');for(var i=0;i<ts.length;i++)ts[i].classList.toggle('on',i===n)}
function openShop(){renderShop();document.getElementById('shop').classList.add('show')}
function closeShop(){document.getElementById('shop').classList.remove('show')}
function togglePause(){paused=!paused;var b=document.querySelector('.side .b3');b.textContent=paused?'▶ 继续':'⏸ 暂停'}
var tt=null;function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(function(){t.classList.remove('show')},1600)}
function getWeather(){try{
 navigator.geolocation.getCurrentPosition(function(pos){
  var la=pos.coords.latitude,lo=pos.coords.longitude;
  fetch('https://wttr.in/'+la+','+lo+'?format=%C&lang=zh').then(function(r){return r.text()}).then(function(t){
   weather=t.indexOf('雨')>=0?'雨':(t.indexOf('雪')>=0?'雪':'晴');
   document.getElementById('weather').textContent='🌤 '+weather+'天';
  }).catch(function(){});
 },function(){}, {timeout:6000});
}catch(e){}}
function checkWeed(){state.p.forEach(function(pl){if(pl&&pl.crop&&!pl.weed&&Date.now()-pl.t>GROW_DAYS*24*3.6e6){pl.weed=true}});save();render()}
function init(){load();getCoins();getWeather();checkWeed();render();renderSeed();renderShop();timer=setInterval(function(){render();checkWeed()},30000)}
init();
</script>
</body>
</html>
