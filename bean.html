<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>莫古菜园</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%237ED06A'/%3E%3Cstop offset='1' stop-color='%23FFD06B'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Ctext x='32' y='44' font-size='34' font-weight='800' text-anchor='middle' fill='%23fff'%3E%F0%9F%8C%B1%3C/text%3E%3C/svg%3E">
<style>
:root{
  --ink:#4A3F5C; --wood:#5d4226; --wood2:#7a5a34; --cream:#FFF3D6; --gold:#FFC94A;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;touch-action:manipulation}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;
  color:var(--ink);background:#8fc6ee;
}
/* ===== 全屏背景层 =====
   背景图命名规则：bean/img/bg_<天气>_<day|night>.jpg
   天气: sun晴 cloud多云 overcast阴 rain雨 storm雷雨 snow雪
   例: bg_sun_day.jpg（白天晴） / bg_rain_night.jpg（夜晚雨）
   把图放进 bean/img/ 即可自动按当地天气切换；未放图时显示下方渐变占位。 */
#sky{position:fixed;inset:0;z-index:0;background:linear-gradient(#8ec9f0,#d9f1ff 52%,#cde8bb 100%);background-size:cover;background-position:center;transition:background-image .6s}
/* 雨丝层：雨天/雷雨时显示，只在下层 */
#rain{position:fixed;inset:0;z-index:1;pointer-events:none;display:none;
  background-image:repeating-linear-gradient(115deg,transparent 0 26px,rgba(190,215,255,.28) 26px 28px);
  background-size:120px 100%;animation:rainfall .55s linear infinite}
@keyframes rainfall{to{background-position:120px 0}}

/* ===== 全屏游戏层（占满整个视口，田块与 UI 全屏铺开） ===== */
.screen{position:fixed;inset:0;z-index:2;overflow:hidden;pointer-events:none}
.screen>*{pointer-events:auto}

/* ===== 顶栏（贴顶，金币精致胶囊） ===== */
.topbar{
  position:absolute;left:1.5%;right:1.5%;top:1%;height:7%;
  display:flex;align-items:center;justify-content:space-between;gap:1.5%;
}
.coinbox{
  display:flex;align-items:center;gap:7px;padding:3px 16px 3px 8px;border-radius:999px;
  background:linear-gradient(#fffdf3,#ffeab6);border:2px solid #e0a63c;
  box-shadow:0 3px 8px rgba(150,95,20,.28), inset 0 1px 0 rgba(255,255,255,.9);
}
.coinbox img{height:24px;width:24px;flex:0 0 auto;animation:coinSpin 3s linear infinite}
@keyframes coinSpin{to{transform:rotateY(360deg)}}
.coinbox b{font-size:clamp(14px,2vw,22px);color:#a8620a;font-weight:900;letter-spacing:.01em}
.wxbar{
  display:flex;align-items:center;gap:10px;padding:3px 14px;border-radius:999px;
  background:rgba(255,250,235,.82);border:2px solid rgba(255,201,74,.7);
  box-shadow:0 3px 8px rgba(90,60,25,.16);backdrop-filter:blur(4px);
  font-weight:800;color:var(--wood);font-size:clamp(11px,1.5vw,17px);white-space:nowrap;
}
.wxbar img{width:1.25em;height:1.25em}
#clock{letter-spacing:.02em}
#date{font-size:clamp(10px,1.3vw,15px);color:#8a6a3f}
@media (max-width:640px){
  #date{display:none}
  .topbar{top:.6%;height:6.4%}
  .wxbar{gap:6px;padding:2px 10px;font-size:11px}
  .coinbox{gap:5px;padding:2px 10px 2px 6px}
  .coinbox img{height:20px;width:20px}
}

/* ===== 田块：草边 + 16 菱形格（素材直贴，菱形靠 PNG 素材本身呈现，不依赖 CSS 裁剪） ===== */
.farmwrap{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);width:94vw;max-width:calc(60vh*1.732);aspect-ratio:1.732}
.edge{position:absolute;inset:-7%;z-index:0;
  background:url(bean/img/plot_grass.png) center/contain no-repeat;filter:saturate(1.05)}
.farm{position:absolute;inset:0;z-index:1;background:#5d4226;border-radius:2%}
.cell{position:absolute;width:25%;height:25%;
  background:center/contain no-repeat;cursor:pointer;
  transition:filter .18s,transform .12s}
.cell:active{transform:scale(.96)}
.crop{position:absolute;left:10%;top:10%;width:80%;height:80%;object-fit:contain;pointer-events:none;z-index:2;display:none}
.mature .crop{display:block;animation:glow 1.6s ease-in-out infinite}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 2px #FFE58A) drop-shadow(0 0 8px rgba(255,200,60,.55)) brightness(1)}
  50%{filter:drop-shadow(0 0 4px #FFE58A) drop-shadow(0 0 16px rgba(255,210,80,.85)) brightness(1.06)}}
@keyframes pop{0%{transform:scale(.2)}60%{transform:scale(1.18)}100%{transform:scale(1)}}
.cell .crop.pop{animation:pop .4s ease}
@keyframes digpop{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

/* ===== 底栏（洛克王国木牌按钮） ===== */
.bottombar{
  position:absolute;left:1.5%;right:1.5%;bottom:2%;height:9.5%;
  display:flex;align-items:center;justify-content:space-evenly;gap:2%;
}
.bbtn{
  position:relative;display:flex;align-items:center;justify-content:center;gap:.45em;
  min-width:23%;min-height:48px;padding:.3em 1.2em;border-radius:16px;text-decoration:none;
  background:linear-gradient(#f4d192,#dfa453);border:3px solid #7a4b1e;color:#fff;
  font-weight:900;font-size:clamp(13px,1.9vw,22px);text-shadow:0 2px 0 rgba(110,65,20,.6);
  box-shadow:0 4px 0 #6b3f15, 0 6px 12px rgba(70,40,10,.32);user-select:none;
  transition:transform .1s,box-shadow .1s;
}
.bbtn::before{content:"";position:absolute;inset:3px;border-radius:11px;border:2px solid rgba(255,255,255,.35);pointer-events:none}
.bbtn:active{transform:translateY(4px);box-shadow:0 0 0 #6b3f15, 0 2px 4px rgba(70,40,10,.3)}
.bbtn .bico{width:1.25em;height:1.25em;flex:0 0 auto;filter:drop-shadow(0 1px 0 rgba(255,255,255,.35))}
.hud{position:absolute;left:3%;right:3%;bottom:15%;height:3.4%;display:flex;align-items:center;justify-content:center;gap:1.4em;
  font-size:clamp(11px,1.4vw,16px);font-weight:800;color:rgba(255,250,230,.98);text-shadow:0 1px 3px rgba(40,25,5,.75);pointer-events:none}
.hud b{color:var(--gold)}

/* ===== 弹窗（全屏覆盖） ===== */
.modal{position:fixed;inset:0;z-index:30;display:none;
  background:rgba(45,30,8,.55);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.modal.on{display:block}
.panel{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:min(94vw,560px);height:min(88vh,640px);border-radius:24px;overflow:hidden;
  background:linear-gradient(#FFFBF0,#FFEED0);border:3px solid rgba(255,201,74,.95);
  box-shadow:0 24px 60px rgba(40,20,0,.45);display:flex;flex-direction:column}
.mhead{display:flex;align-items:center;justify-content:space-between;padding:12px 18px;
  background:linear-gradient(135deg,#FFD06B,#FFA93C);color:#5d3c00;font-weight:900;font-size:clamp(16px,2.2vw,24px)}
.mhead .mclose{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.9);border:2px solid #c8902c;
  font-weight:900;font-size:17px;color:#a05c00;cursor:pointer;box-shadow:0 2px 4px rgba(0,0,0,.15)}
.mbody{flex:1;overflow-y:auto;padding:14px}
.mrow{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;margin-bottom:10px;
  background:#FFF6E0;border:2px solid rgba(255,201,74,.55);box-shadow:0 2px 5px rgba(150,100,30,.12)}
.mrow .mico{width:56px;height:56px;object-fit:contain;flex:0 0 auto;filter:drop-shadow(0 2px 3px rgba(0,0,0,.15))}
.mrow .minfo{flex:1;min-width:0}
.mrow .mname{font-weight:900;color:#5d4226;font-size:clamp(14px,1.8vw,18px)}
.mrow .msub{font-size:clamp(11px,1.4vw,14px);color:#a08050;font-weight:600;margin-top:2px}
.mrow .mbtn{min-height:42px;padding:.25em 1.2em;border-radius:999px;border:none;font-weight:900;font-size:clamp(13px,1.7vw,17px);cursor:pointer;color:#fff;box-shadow:0 3px 6px rgba(0,0,0,.2);flex:0 0 auto}
.mbtn.buy{background:linear-gradient(#FFD06B,#FF9D3D);color:#7a4d00}
.mbtn.sell{background:linear-gradient(#8BD67A,#4DA83A)}
.mbtn:active{transform:scale(.94)}
.mempty{text-align:center;color:#b49a6a;font-weight:700;padding:40px 0;font-size:clamp(13px,1.7vw,17px)}

/* 种子选择浮窗 */
.seedbar{position:absolute;left:50%;bottom:16%;transform:translateX(-50%);z-index:20;display:none;
  background:rgba(255,252,242,.97);border:2.5px solid rgba(255,201,74,.9);border-radius:20px;
  box-shadow:0 12px 34px rgba(40,20,0,.32);padding:10px 12px;gap:8px;max-width:96%}
.seedbar.on{display:flex;flex-wrap:wrap;justify-content:center}
.seeditem{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 10px;border-radius:14px;cursor:pointer;background:#FFF6E0;border:2px solid rgba(255,201,74,.55);min-width:64px;box-shadow:0 2px 4px rgba(150,100,30,.1)}
.seeditem img{width:44px;height:44px;object-fit:contain}
.seeditem span{font-size:clamp(10px,1.3vw,13px);font-weight:900;color:#5d4226}
.seeditem:active{transform:scale(.92)}
.seedbar .sclose{margin-left:4px;width:30px;height:30px;border-radius:50%;background:#ffe;border:2px solid #c8a05c;font-weight:900;color:#a05c00;cursor:pointer;align-self:center}

/* ===== 飘字 ===== */
.fly{position:fixed;z-index:40;pointer-events:none;font-weight:900;color:#FFD06B;
  text-shadow:0 1px 2px rgba(80,50,0,.4);animation:fly 1s ease forwards;font-size:clamp(15px,2.2vw,26px)}
@keyframes fly{0%{opacity:0;transform:translateY(6px) scale(.8)}20%{opacity:1;transform:translateY(0) scale(1.05)}100%{opacity:0;transform:translateY(-44px) scale(1)}}
</style>
</head>
<body>
<div id="sky"></div>
<div id="rain"></div>

<div class="screen">
  <div class="topbar">
    <div class="coinbox"><img src="bean/img/coin.png" alt=""><b id="coins">0</b></div>
    <div class="wxbar"><img id="wico" src="bean/img/weather_sun.png" alt="天气"><span id="wtext">晴天</span><span id="clock">--:--</span><span id="date"></span></div>
  </div>

  <div class="farmwrap">
    <div class="edge"></div>
    <div class="farm" id="farm"></div>
  </div>

  <div class="hud" id="hud"><span>开垦 <b id="hDig">0</b>/16</span><span>收获 <b id="hHar">0</b></span><span>今日菜价 <b id="hPrice">--</b></span></div>

  <div class="bottombar">
    <a class="bbtn" id="bShop" href="javascript:openShop()"><img class="bico" src="bean/img/ico_shop.png" alt="">商店</a>
    <a class="bbtn" id="bBag" href="javascript:openBag()"><img class="bico" src="bean/img/ico_bag.png" alt="">口袋</a>
    <a class="bbtn" id="bBack" href="main.html"><img class="bico" src="bean/img/ico_back.png" alt="">返回</a>
  </div>

  <div class="seedbar" id="seedbar"></div>

  <div class="modal" id="modal">
    <div class="panel">
      <div class="mhead"><span id="mTitle">商店</span><button class="mclose" onclick="closeModal()">✕</button></div>
      <div class="mbody" id="mBody"></div>
    </div>
  </div>
</div>

<script>
'use strict';
/* ================= 配置 ================= */
var API='https://api.mogoing.xyz';
var IMG='bean/img/';
var CROPS={
  apple:{name:'苹果',base:1,growH:2,seedRate:2,seed:'seed/apple_seed.png',imgs:['apple_s1.webp','apple_s2.webp','apple_s3.webp','apple_s4.webp']},
  pear:{name:'梨',base:1,growH:3,seedRate:2,seed:'seed/pear_seed.png',imgs:['pear_s1.webp','pear_s2.webp','pear_s3.webp','pear_s4.webp']},
  corn:{name:'玉米',base:3,growH:3,seedRate:1,seed:'seed/corn_seed.png',imgs:['corn_s1.webp','corn_s2.webp','corn_s3.webp','corn_s4.webp']},
  pumpkin:{name:'南瓜',base:8,growH:6,seedRate:1,seed:'seed/pumpkin_seed.png',imgs:['pumpkin_s1.webp','pumpkin_s2.webp','pumpkin_s3.webp','pumpkin_s4.webp']},
  strawberry:{name:'草莓',base:5,growH:4,seedRate:1,seed:'seed/strawberry_seed.png',imgs:['strawberry_s1.webp','strawberry_s2.webp','strawberry_s3.webp','strawberry_s4.webp']},
  carrot:{name:'胡萝卜',base:2,growH:2,seedRate:1,seed:'seed/carrot_seed.png',imgs:['carrot_s1.webp','carrot_s2.webp','carrot_s3.webp','carrot_s4.webp']},
  radish:{name:'白萝卜',base:2,growH:4,seedRate:1,seed:'seed/radish_seed.png',imgs:['radish_s1.webp','radish_s2.webp','radish_s3.webp','radish_s4.webp']}
};
/* 备选作物（素材已备好，启用需补生长阶段图）：
   tomato番茄 eggplant茄子 pepper辣椒 watermelon西瓜 —— 种子图标已就绪(seed/xxx_seed.png) */
/* 菱形格定位（百分比）：16 格交叉排列，坐标源于已验收几何网格 */
var POS=[[37.5,0],[25,12.5],[12.5,25],[0,37.5],[50,12.5],[37.5,25],[25,37.5],[12.5,50],
         [62.5,25],[50,37.5],[37.5,50],[25,62.5],[75,37.5],[62.5,50],[50,62.5],[37.5,75]];

/* ================= 状态 ================= */
var UN='',PW='',coins=0;
var plots=[];            /* {s:-1草/0地/1土/2作物, c:-1, st:0-3, pa:0, w:0, f:0} */
var inv={seed:{apple:0,pear:0,corn:0,pumpkin:0,strawberry:0,carrot:0,radish:0},
         crop:{apple:0,pear:0,corn:0,pumpkin:0,strawberry:0,carrot:0,radish:0}};
var digCount=0,harvest=0,weather='sun',night=false;
var cells=[];

/* ================= 工具 ================= */
function $(id){return document.getElementById(id)}
function req(url,opt){opt=opt||{};opt.headers=opt.headers||{};opt.headers['User-Agent']='Mozilla/5.0 bean';
  return fetch(url,opt).then(function(r){return r.json()})}
function saveTimer(){clearTimeout(saveTimer.t);saveTimer.t=setTimeout(saveRemote,900)}
function fly(x,y,txt,color){var d=document.createElement('div');d.className='fly';d.textContent=txt;
  d.style.left=x+'px';d.style.top=y+'px';if(color)d.style.color=color;
  document.body.appendChild(d);setTimeout(function(){d.remove()},1000)}

/* ================= 价格与天气 ================= */
function dayHash(){var d=new Date(),v=d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate();
  var h=0;v=(v+'').split('');for(var i=0;i<v.length;i++)h=(h*31+(+v[i]))%997;
  return h%50} /* 0-49 */
function priceOf(c){return Math.max(1,Math.round(c.base*(0.75+dayHash()/100)*(weather==='rain'||weather==='storm'?1.2:1)))}
function seedPrice(c){return Math.max(1,Math.round(c.base*0.5*(0.75+dayHash()/100)))}
/* 天气分档：sun晴 cloud多云 overcast阴 rain雨 storm雷雨 snow雪 */
var WNAME={sun:'晴天',cloud:'多云',overcast:'阴天',rain:'雨天',storm:'雷雨',snow:'雪天'};
var WICO={sun:'weather_sun',cloud:'weather_cloud',overcast:'weather_cloud',rain:'weather_rain',storm:'weather_storm',snow:'weather_snow'};
function applyWeather(){
  var h=new Date().getHours();night=(h<6||h>=19);
  var key=weather+'_'+(night?'night':'day');
  var sky=$('sky');
  sky.style.backgroundImage='url('+IMG+'bg_'+key+'.jpg)';
  var test=new Image();test.onerror=function(){sky.style.backgroundImage=''};
  test.src=IMG+'bg_'+key+'.jpg'; /* 图不存在时自动回退 CSS 渐变 */
  $('rain').style.display=(weather==='rain'||weather==='storm')?'block':'none';
  $('wtext').textContent=(night?'夜晚·':'')+WNAME[weather];
  $('wico').src=IMG+WICO[weather]+'.png';
  $('hPrice').textContent=priceOf(CROPS.apple)+'金';
}
function fetchWeather(){
  if(navigator.geolocation){
    navigator.geolocation.getCurrentPosition(function(p){
      var lat=p.coords.latitude,lng=p.coords.longitude;
      req('https://api.open-meteo.com/v1/forecast?latitude='+lat+'&longitude='+lng+'&current_weather=true').then(function(j){
        var wc=(j&&j.current_weather&&j.current_weather.weathercode!=null)?j.current_weather.weathercode:2;
        if(wc<=1)weather='sun';
        else if(wc===2)weather='cloud';
        else if(wc===3||wc===45||wc===48)weather='overcast';
        else if(wc>=51&&wc<=67)weather='rain';
        else if(wc>=71&&wc<=77)weather='snow';
        else if(wc>=80&&wc<=82)weather='rain';
        else if(wc>=85&&wc<=86)weather='snow';
        else if(wc>=95)weather='storm';
        else weather='sun';
        applyWeather();saveRemote();
      }).catch(function(){weather='sun';applyWeather()});
    },function(){weather='sun';applyWeather()}, {timeout:8000});
  }else{weather='sun';applyWeather()}
}

/* ================= 时钟 ================= */
function tick(){
  var d=new Date(),hh=d.getHours();
  $('clock').textContent=(hh<10?'0':'')+hh+':'+(d.getMinutes()<10?'0':'')+d.getMinutes();
  $('date').textContent=(d.getMonth()+1)+'月'+d.getDate()+'日';
}
setInterval(tick,10000);tick();

/* ================= 田块渲染 ================= */
function buildFarm(){
  var f=$('farm');var h='';
  for(var i=0;i<16;i++){
    h+='<div class="cell" id="c'+i+'" style="left:'+POS[i][0]+'%;top:'+POS[i][1]+'%" onclick="tap('+i+')">'+
       '<img class="crop" id="cr'+i+'" draggable="false"></div>';
  }
  f.innerHTML=h;
  for(var i=0;i<16;i++){cells.push($('c'+i))}
}
function bgOf(p){
  if(p.s===-1)return IMG+'plot_grass.png';
  if(p.s===0)return IMG+'plot_grass.png';
  return IMG+'plot_soil.png';
}
function renderCell(i){
  var p=plots[i],el=cells[i],im=$('cr'+i);
  el.style.backgroundImage='url('+bgOf(p)+')';
  el.style.filter='';
  el.classList.remove('mature');
  if(p.s===-1){el.style.filter='brightness(.8) saturate(.9)'}
  if(p.s===2){
    var c=CROPS[p.c];
    im.src=IMG+c.imgs[p.st];
    im.style.display='block';
    if(p.st===3){el.classList.add('mature')}
  }else{
    im.style.display='none';im.removeAttribute('src');
  }
}
function renderAll(){for(var i=0;i<16;i++)renderCell(i);refreshHud()}
function refreshHud(){
  $('hDig').textContent=digCount;
  $('hHar').textContent=harvest;
}

/* ================= 生长推进 ================= */
function advance(){
  var now=Date.now(),dirty=false;
  for(var i=0;i<16;i++){
    var p=plots[i];
    if(p.s!==2||p.st>=3)continue;
    var c=CROPS[p.c];
    if(now-p.pa>=c.growH*3600*1000){p.st++;dirty=true}
    renderCell(i);
  }
  if(dirty)saveTimer();
}
setInterval(advance,15000);

/* ================= 交互 ================= */
function tap(i){
  var p=plots[i];
  if(p.s===-1){           /* 长草：除杂草 */
    p.s=0;renderCell(i);saveTimer();return;
  }
  if(p.s===0){            /* 未开垦：开垦 */
    var cost=10+digCount*2;
    if(coins<cost){flyP(i,'金币不足');shake(cells[i]);return}
    spend(cost);p.s=1;digCount++;renderCell(i);saveTimer();return;
  }
  if(p.s===1){            /* 已开垦：选种子 */
    openSeedbar(i);return;
  }
  if(p.s===2){
    if(p.st===3){         /* 成熟：收获 */
      var c=CROPS[p.c],amt=1+p.w+p.f;
      inv.crop[p.c]+=amt;harvest++;
      p.s=1;p.c=-1;p.st=0;p.w=0;p.f=0;
      renderCell(i);
      var pr=priceOf(c)*amt;gain(pr);
      saveTimer();return;
    }
    shake(cells[i]);      /* 未熟：轻晃 */
  }
}
function shake(el){el.style.animation='';void el.offsetWidth;el.style.animation='digpop .32s ease'}
function flyP(i,txt){var el=cells[i],r=el.getBoundingClientRect();
  fly(r.left+r.width/2,r.top+8,txt)}

/* ================= 金币 ================= */
function spend(n){coins-=n;$('coins').textContent=coins;
  req(API+'/api/spend',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({username:UN,password:PW,amount:n})}).catch(function(){})}
function gain(n){coins+=n;$('coins').textContent=coins;
  req(API+'/api/gain',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({username:UN,password:PW,amount:n})}).catch(function(){})}

/* ================= 种子选择 ================= */
var selPlot=-1;
function openSeedbar(i){
  selPlot=i;
  var sb=$('seedbar');var h='';var has=false;
  for(var k in CROPS){
    if(inv.seed[k]>0){has=true;
      h+='<div class="seeditem" onclick="plant(\''+k+'\')"><img src="'+IMG+CROPS[k].seed+'"><span>'+inv.seed[k]+'</span></div>';
    }
  }
  if(!has){flyP(i,'没种子');return}
  h+='<button class="sclose" onclick="closeSeedbar()">✕</button>';
  sb.innerHTML=h;sb.classList.add('on');
}
function closeSeedbar(){$('seedbar').classList.remove('on')}
function plant(k){
  if(selPlot<0)return;
  var p=plots[selPlot];
  if(p.s!==1)return;
  inv.seed[k]--;p.s=2;p.c=k;p.st=0;p.pa=Date.now();p.w=0;p.f=0;
  closeSeedbar();renderCell(selPlot);
  var im=$('cr'+selPlot);im.classList.add('pop');setTimeout(function(){im.classList.remove('pop')},420);
  saveTimer();
}

/* ================= 商店 / 口袋 ================= */
function openShop(){
  $('mTitle').textContent='商店';
  var h='';
  for(var k in CROPS){
    var c=CROPS[k],sp=seedPrice(c);
    h+='<div class="mrow"><img class="mico" src="'+IMG+c.seed+'"><div class="minfo">'+
       '<div class="mname">'+c.name+'种子</div><div class="msub">今日 '+sp+' 金 / '+c.seedRate+' 个</div></div>'+
       '<button class="mbtn buy" onclick="buySeed(\''+k+'\')">'+sp+'金</button></div>';
  }
  $('mBody').innerHTML=h;openModal();
}
function buySeed(k){
  var c=CROPS[k],sp=seedPrice(c);
  if(coins<sp){flyP(6,'金币不足');return}
  spend(sp);inv.seed[k]+=c.seedRate;renderShop();saveTimer();
}
function openBag(){
  $('mTitle').textContent='口袋';
  var h='';var any=false;
  for(var k in CROPS){
    var c=CROPS[k];
    if(inv.crop[k]>0){any=true;
      var pr=priceOf(c);
      h+='<div class="mrow"><img class="mico" src="'+IMG+c.imgs[3]+'"><div class="minfo">'+
         '<div class="mname">'+c.name+'</div><div class="msub">'+inv.crop[k]+' 个 · 今日 '+pr+' 金/个</div></div>'+
         '<button class="mbtn sell" onclick="sellCrop(\''+k+'\')">卖出</button></div>';
    }
  }
  if(!any)h='<div class="mempty">还没有收获，去种点什么吧</div>';
  $('mBody').innerHTML=h;openModal();
}
function sellCrop(k){
  var c=CROPS[k],pr=priceOf(c),n=inv.crop[k];
  if(n<=0)return;
  inv.crop[k]=0;gain(pr*n);openBag();saveTimer();
}
function renderShop(){if($('modal').classList.contains('on')&&$('mTitle').textContent==='商店')openShop()}
function openModal(){$('modal').classList.add('on')}
function closeModal(){$('modal').classList.remove('on')}

/* ================= 存档 ================= */
function saveRemote(){
  var data={plots:plots,inv:inv,digCount:digCount,harvest:harvest};
  req(API+'/api/save?username='+encodeURIComponent(UN)+'&password='+encodeURIComponent(PW)+'&game=bean',{
    method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify(data)}).catch(function(){});
}
function loadRemote(){
  req(API+'/api/save?username='+encodeURIComponent(UN)+'&password='+encodeURIComponent(PW)+'&game=bean').then(function(j){
    if(j&&j.ok&&j.data){
      var d=j.data;
      plots=d.plots||makePlots();inv=d.inv||inv;digCount=d.digCount||0;harvest=d.harvest||0;
    }else{plots=makePlots()}
    renderAll();
  }).catch(function(){plots=makePlots();renderAll()});
}
function makePlots(){var a=[];for(var i=0;i<16;i++)a.push({s:0,c:-1,st:0,pa:0,w:0,f:0});return a}

/* ================= 启动 ================= */
UN=localStorage.getItem('blindbox_user')||'';
PW=localStorage.getItem('blindbox_pass')||'';
if(!UN||!PW){location.href='index.html';}
req(API+'/api/user?username='+encodeURIComponent(UN)+'&password='+encodeURIComponent(PW)).then(function(j){
  if(j&&j.ok){coins=j.user.coins||0;$('coins').textContent=coins;buildFarm();loadRemote();fetchWeather();}
  else{location.href='index.html';}
}).catch(function(){location.href='index.html'});
</script>
