(function(){
  if('ontouchstart' in window || navigator.maxTouchPoints>0) return;
  function mk(type,e){
    try{
      var t=new Touch({identifier:1,target:e.target,clientX:e.clientX,clientY:e.clientY,pageX:e.pageX,pageY:e.pageY,screenX:e.screenX,screenY:e.screenY});
      var list=(type==='touchend'||type==='touchcancel')?[]:[t];
      var ev=new TouchEvent(type,{touches:list,targetTouches:list,changedTouches:[t],bubbles:true,cancelable:true,view:window});
      e.target.dispatchEvent(ev);
    }catch(err){}
  }
  window.addEventListener('mousedown',function(e){mk('touchstart',e);},true);
  window.addEventListener('mousemove',function(e){if(e.buttons===1)mk('touchmove',e);},true);
  window.addEventListener('mouseup',function(e){mk('touchend',e);},true);
})();
</script>
