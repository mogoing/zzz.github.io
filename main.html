<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>多巴胺惊喜屋 · 盲盒</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23FF6B6B'/%3E%3Cstop offset='1' stop-color='%23FFD93D'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Ctext x='32' y='45' font-size='38' font-weight='800' text-anchor='middle' fill='%23fff'%3E%3F%3C/text%3E%3C/svg%3E">
<style>
  :root{
    --coral:#FF6B6B; --sunny:#FFD93D; --mint:#4ECDC4; --grape:#9B5DE5; --pink:#FF9DE2;
    --ink:#4A3F5C; --muted:#9A8FB5;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;
    min-height:100vh;color:var(--ink);
    background:linear-gradient(165deg,#FFF6E9,#FFE8D6);
    display:flex;flex-direction:column;align-items:center;
    padding:20px 16px 44px;overflow-x:hidden;
  }
  .blob{position:fixed;border-radius:50%;filter:blur(56px);opacity:.5;z-index:0;animation:float 14s ease-in-out infinite}
  .blob-a{width:36vmax;height:36vmax;background:var(--pink);top:-12vmax;left:-10vmax}
  .blob-b{width:28vmax;height:28vmax;background:var(--mint);bottom:-8vmax;right:-8vmax;animation-delay:-5s}
  .blob-c{width:20vmax;height:20vmax;background:var(--sunny);top:32%;right:4vmax;opacity:.32;animation-delay:-9s}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(2.6vmax)}}

  /* ===== 画布装饰：线条、圆环、椭圆、点阵（淡淡色） ===== */
  .deco{position:fixed;z-index:0;pointer-events:none;opacity:.4}
  .deco-ring{
    width:34vmin;height:34vmin;right:-6vmin;top:16%;
    border:2.5px dashed rgba(155,93,229,.45);border-radius:50%;
    animation:spin 46s linear infinite;
  }
  .deco-ring::after{
    content:"";position:absolute;inset:14%;border:1.5px solid rgba(255,107,107,.35);border-radius:50%;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  .deco-ellipse{
    width:26vmin;height:9vmin;left:-7vmin;bottom:14%;border-radius:50%;
    background:linear-gradient(90deg,rgba(78,205,196,.4),rgba(155,93,229,.22));
    transform:rotate(-18deg);
  }
  .deco-line{
    width:60vmin;height:16vmin;left:8%;top:6%;
    border-bottom:3px solid rgba(255,180,120,.5);border-radius:50%;
    transform:rotate(4deg);
  }
  .deco-line2{
    width:40vmin;height:12vmin;right:-4vmin;bottom:4%;
    border-bottom:3px solid rgba(255,157,226,.45);border-radius:50%;
    transform:rotate(-6deg);
  }
  .deco-dots{
    width:17vmin;height:11vmin;left:14%;bottom:26%;
    background-image:radial-gradient(circle,rgba(255,107,107,.5) 3px,transparent 3.5px);
    background-size:26px 26px;
  }
  .deco-dots2{
    width:13vmin;height:9vmin;right:10%;top:36%;
    background-image:radial-gradient(circle,rgba(78,205,196,.55) 3px,transparent 3.5px);
    background-size:24px 24px;
  }
  .deco-star{
    width:16px;height:16px;right:22%;top:12%;
    background:linear-gradient(135deg,var(--sunny),#FFB84C);
    clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);
    opacity:.65;
  }
  .deco-star2{
    width:12px;height:12px;left:6%;top:40%;
    background:linear-gradient(135deg,var(--coral),var(--pink));
    clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);
    opacity:.55;
  }
  header{
    position:relative;z-index:1;width:min(94vw,760px);
    display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;
    flex-wrap:wrap;
  }
  h1{
    font-size:26px;letter-spacing:3px;
    background:linear-gradient(90deg,var(--grape),var(--coral),var(--sunny));
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .user{font-size:14px;color:var(--muted);margin-top:2px}
  .top-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .logout{
    flex:none;min-height:44px;display:flex;align-items:center;
    padding:0 16px;border:none;border-radius:999px;cursor:pointer;
    font-size:14px;font-weight:700;color:#fff;
    background:linear-gradient(135deg,var(--coral),var(--grape));
    box-shadow:0 6px 16px rgba(255,107,107,.3);transition:transform .15s;
  }
  .logout:hover{transform:translateY(-2px)}
  .logout:active{transform:scale(.96)}

  /* ===== 钱包区 ===== */
  .wallet{
    position:relative;z-index:1;display:flex;align-items:center;gap:10px;
    background:rgba(255,255,255,.82);border-radius:999px;padding:5px 8px 5px 6px;
    box-shadow:0 6px 18px rgba(155,93,229,.12);
  }
  .wallet img{width:34px;height:34px;border-radius:50%;object-fit:cover;box-shadow:0 3px 8px rgba(255,180,60,.45)}
  .wallet b{font-size:16px;color:var(--ink);min-width:28px;text-align:center}
  .wallet .recharge{
    flex:none;min-height:32px;padding:0 12px;border:none;border-radius:999px;cursor:pointer;
    font-size:13px;font-weight:800;color:#fff;
    background:linear-gradient(135deg,var(--sunny),#FF9F6B);
    box-shadow:0 4px 12px rgba(255,159,107,.4);transition:transform .15s;
  }
  .wallet .recharge:active{transform:scale(.94)}

  /* ===== 功能区按钮（留言 / 日记） ===== */
  .fun-row{
    position:relative;z-index:1;display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap;justify-content:center;
  }
  .fun-btn{
    flex:none;min-height:44px;display:flex;align-items:center;gap:7px;
    padding:0 18px;border:none;border-radius:999px;cursor:pointer;
    font-size:14px;font-weight:800;color:#fff;
    box-shadow:0 8px 20px rgba(139,92,246,.22);transition:transform .15s;
  }
  .fun-btn:active{transform:scale(.95)}
  .fun-btn.mint{background:linear-gradient(135deg,#4ECDC4,#2FBFB5);box-shadow:0 8px 20px rgba(47,191,181,.28)}
  .fun-btn.grape{background:linear-gradient(135deg,#9B5DE5,#7C3AED);box-shadow:0 8px 20px rgba(124,58,237,.28)}

  .hint{position:relative;z-index:1;font-size:14px;color:var(--muted);margin-bottom:24px}

  /* ===== 游戏墙（一页六个：两排三个，行距约为盒子高度一半） ===== */
  .stage{
    position:relative;z-index:1;
    display:flex;flex-wrap:wrap;justify-content:center;
    column-gap:26px;row-gap:75px;
    width:min(94vw,522px);margin-top:34px;
  }
  .box{position:relative;width:150px;height:150px;cursor:pointer}
  .box.enter{animation:boxIn .4s cubic-bezier(.2,.9,.3,1.25) both}
  @keyframes boxIn{from{opacity:0;transform:translateY(16px) scale(.92)}to{opacity:1;transform:none}}
  .lid{
    position:absolute;top:0;left:4%;width:92%;height:34%;z-index:3;border-radius:14px 14px 6px 6px;
    display:flex;align-items:center;justify-content:center;
    font-size:20px;font-weight:800;color:#fff;
    box-shadow:0 6px 14px rgba(0,0,0,.14);
    transform-origin:top center;
    transition:transform .35s cubic-bezier(.2,.8,.3,1.1);
  }
  .box.b1 .lid{background:linear-gradient(135deg,var(--coral),#FF9F6B)}
  .box.b2 .lid{background:linear-gradient(135deg,var(--mint),#7BDBCB)}
  .box.b3 .lid{background:linear-gradient(135deg,var(--grape),var(--pink))}
  .box.b4 .lid{background:linear-gradient(135deg,var(--sunny),#FFB84C)}
  .box.b5 .lid{background:linear-gradient(135deg,var(--pink),#FF9F6B)}
  .box.b6 .lid{background:linear-gradient(135deg,#7BDBCB,var(--mint))}
  .body{
    position:absolute;bottom:0;left:0;width:100%;height:70%;z-index:1;border-radius:10px 10px 18px 18px;
    display:flex;align-items:center;justify-content:center;overflow:hidden;
    box-shadow:inset 0 -10px 18px rgba(0,0,0,.07);
    transition:box-shadow .3s;
  }
  .box.b1 .body{background:linear-gradient(160deg,#FFB199,#FFE0B2)}
  .box.b2 .body{background:linear-gradient(160deg,#BFF0E8,#E4FAF6)}
  .box.b3 .body{background:linear-gradient(160deg,#E9C9FF,#F9E3FF)}
  .box.b4 .body{background:linear-gradient(160deg,#FFF3C4,#FFF8E1)}
  .box.b5 .body{background:linear-gradient(160deg,#FFD3EE,#FFEAF7)}
  .box.b6 .body{background:linear-gradient(160deg,#D4F5F0,#ECFBF8)}
  .ribbon{
    position:absolute;top:9px;left:50%;transform:translateX(-50%);
    width:26%;height:24px;z-index:2;opacity:.95;
    background:linear-gradient(90deg,rgba(255,255,255,.95),rgba(255,255,255,.55));
    clip-path:polygon(0 0,100% 0,100% 100%,50% 72%,0 100%);
  }
  .reveal{
    position:relative;z-index:4;display:flex;flex-direction:column;align-items:center;gap:7px;
    opacity:0;transform:scale(.6);
    transition:opacity .3s,transform .35s cubic-bezier(.2,.8,.3,1.3);
  }
  .box:hover .lid,.box.open .lid{transform:translateY(-16px) rotate(-5deg)}
  .box:hover .reveal,.box.open .reveal{opacity:1;transform:scale(1)}
  .box:hover .body,.box.open .body{box-shadow:0 14px 26px rgba(0,0,0,.1)}
  .r-name{font-size:14px;font-weight:700}
  .r-go{
    font-size:14px;font-weight:700;color:#fff;
    background:linear-gradient(135deg,var(--coral),var(--grape));
    padding:4px 12px;border-radius:999px;box-shadow:0 4px 10px rgba(255,107,107,.3);
  }
  /* CSS 小蛇 */
  .mini-snake{display:flex;align-items:center}
  .mini-snake i{width:13px;height:13px;border-radius:4px;margin-left:-4px;background:linear-gradient(135deg,var(--mint),#2FBFB5);box-shadow:0 2px 4px rgba(0,0,0,.15)}
  .mini-snake i:first-child{
    margin-left:0;width:17px;height:17px;border-radius:6px;position:relative;
    background:linear-gradient(135deg,var(--sunny),#FFB84C);
  }
  .mini-snake i:first-child::before,.mini-snake i:first-child::after{
    content:"";position:absolute;top:4px;width:4px;height:4px;border-radius:50%;background:var(--ink);
  }
  .mini-snake i:first-child::before{left:3px}
  .mini-snake i:first-child::after{right:3px}
  /* 连连看图标：一方一圆 + 连线 */
  .i-lian{display:flex;align-items:center;gap:3px}
  .i-lian b{width:14px;height:14px;border-radius:5px;background:linear-gradient(135deg,var(--coral),#FF9F6B);box-shadow:0 2px 4px rgba(0,0,0,.15)}
  .i-lian i{width:12px;height:2.5px;border-radius:2px;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.15)}
  .i-lian u{width:14px;height:14px;background:linear-gradient(135deg,var(--mint),#2FBFB5);box-shadow:0 2px 4px rgba(0,0,0,.15)}
  /* 消消乐图标：三颗水果 */
  .i-xiao{display:flex;gap:3px}
  .i-xiao i{
    width:17px;height:17px;border-radius:5px;background:#fff;
    display:flex;align-items:center;justify-content:center;
    font-size:12px;font-style:normal;line-height:1;box-shadow:0 2px 5px rgba(0,0,0,.14);
  }
  /* 植物大战僵尸图标：小太阳 + 绿芽 */
  .i-pvz{position:relative;width:26px;height:26px}
  .i-pvz i{
    position:absolute;inset:0;border-radius:50%;
    background:radial-gradient(circle at 35% 32%,#FFF3B0,#FFC93C 62%,#FFA726);
    box-shadow:0 2px 6px rgba(255,169,38,.5);
  }
  .i-pvz i::before{
    content:"";position:absolute;inset:-6px;border-radius:50%;
    background:repeating-conic-gradient(rgba(255,201,60,.9) 0 12deg,transparent 12deg 30deg);
    -webkit-mask:radial-gradient(circle,#000 30%,transparent 55%);
            mask:radial-gradient(circle,#000 30%,transparent 55%);
  }
  .i-pvz b{
    position:absolute;left:50%;bottom:-5px;transform:translateX(-50%);
    width:6px;height:9px;border-radius:3px 3px 2px 2px;
    background:linear-gradient(180deg,#57C785,#3BA66E);
  }
  .i-pvz b::before,.i-pvz b::after{
    content:"";position:absolute;top:1px;width:6px;height:3.5px;border-radius:4px;
    background:#57C785;
  }
  .i-pvz b::before{left:-5px;transform:rotate(28deg)}
  .i-pvz b::after{right:-5px;transform:rotate(-28deg)}
  /* 天天酷跑图标：奔跑小人 */
  .i-run{position:relative;width:28px;height:26px}
  .i-run .head{position:absolute;top:0;right:1px;width:10px;height:10px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFE0BD,#F5A96F)}
  .i-run .body{position:absolute;top:8px;right:6px;width:8px;height:12px;border-radius:4px;background:linear-gradient(135deg,var(--coral),var(--grape));transform:rotate(-18deg)}
  .i-run .arm{position:absolute;top:9px;width:3px;height:8px;border-radius:2px;background:#F5A96F}
  .i-run .arm.l{right:12px;transform:rotate(-40deg)}
  .i-run .arm.r{right:2px;transform:rotate(35deg)}
  .i-run .leg{position:absolute;bottom:0;width:3.5px;height:11px;border-radius:2px;background:var(--ink)}
  .i-run .leg.l{right:11px;transform:rotate(35deg)}
  .i-run .leg.r{right:2px;transform:rotate(-25deg)}
  /* 敬请期待 */
  .soon{font-size:14px;font-weight:700;color:var(--muted)}
  .lock{width:20px;height:15px;border:3px solid var(--muted);border-top:none;border-radius:0 0 6px 6px;position:relative;margin-bottom:10px}
  .lock::before{
    content:"";position:absolute;top:-12px;left:50%;transform:translateX(-50%);
    width:11px;height:13px;border:3px solid var(--muted);border-bottom:none;border-radius:9px 9px 0 0;
  }

  /* ===== 翻页 ===== */
  .pager{
    position:relative;z-index:1;display:flex;align-items:center;gap:16px;
    margin-top:26px;
  }
  .p-btn{
    width:44px;height:44px;border:none;border-radius:50%;cursor:pointer;
    background:linear-gradient(135deg,var(--coral),var(--grape));
    color:#fff;font-size:20px;font-weight:800;
    box-shadow:0 8px 20px rgba(155,93,229,.35);transition:transform .15s,opacity .2s;
    display:flex;align-items:center;justify-content:center;
  }
  .p-btn:active{transform:scale(.9)}
  .p-btn:disabled{opacity:.3;cursor:default;transform:none}
  .p-ind{
    font-size:14px;font-weight:800;color:var(--grape);letter-spacing:1px;
    background:rgba(255,255,255,.85);border-radius:999px;padding:8px 16px;
    box-shadow:0 4px 14px rgba(155,93,229,.14);
  }

  .toast{
    position:fixed;left:50%;top:14%;transform:translateX(-50%) translateY(-8px);
    background:rgba(74,63,92,.92);color:#fff;font-size:14px;font-weight:700;
    padding:10px 18px;border-radius:999px;z-index:40;opacity:0;transition:.3s;pointer-events:none;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  @media (max-width:560px){
    h1{font-size:22px}
    .box{width:min(27vw,128px);height:min(27vw,128px)}
    .stage{column-gap:16px;row-gap:calc(min(27vw,128px) / 2 + 22px)}
    header{justify-content:center;gap:8px}
    .top-right{gap:8px}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none!important}.lid,.reveal{transition:none!important}}
</style>
</head>
<body>
  <div class="blob blob-a"></div><div class="blob blob-b"></div><div class="blob blob-c"></div>
  <div class="deco deco-ring"></div>
  <div class="deco deco-ellipse"></div>
  <div class="deco deco-line"></div>
  <div class="deco deco-line2"></div>
  <div class="deco deco-dots"></div>
  <div class="deco deco-dots2"></div>
  <div class="deco deco-star"></div>
  <div class="deco deco-star2"></div>
  <header>
    <div>
      <h1>多巴胺惊喜屋</h1>
      <p class="user" id="hello"></p>
    </div>
    <div class="top-right">
      <div class="wallet">
        <img src="assets/coin.png" alt="金币">
        <b id="coinNum">0</b>
        <button class="recharge" id="goRecharge">充值</button>
      </div>
      <button class="logout" id="logout">退出登录</button>
    </div>
  </header>
  <div class="fun-row">
    <button class="fun-btn mint" id="goBoard">💬 留言板</button>
    <button class="fun-btn grape" id="goDiary">📖 我的日记</button>
  </div>
  <p class="hint" id="hint"></p>
  <section class="stage" id="stage"></section>
  <nav class="pager">
    <button class="p-btn" id="prev" aria-label="上一页">‹</button>
    <span class="p-ind" id="pind"></span>
    <button class="p-btn" id="next" aria-label="下一页">›</button>
  </nav>
  <div class="toast" id="toast"></div>
<script>
  // ===== 后端 API =====
  const API = 'https://zzz-backend.3122182865.workers.dev';

  // ===== 登录守卫 =====
  const user = localStorage.getItem('blindbox_user');
  if (!user) location.replace('index.html');
  const pass = localStorage.getItem('blindbox_pass') || '';
  const manager = localStorage.getItem('blindbox_manager') === '1';
  const offline = localStorage.getItem('blindbox_offline') === '1';
  document.getElementById('hello').textContent = offline ? '你好，' + user + '（离线）' : '你好，' + user;

  // ===== 游戏列表：要加新游戏就往下面数组加一行即可（name=名字 desc=一句话 icon=图标 target=页面）=====
  const GAMES = [
    { name:'贪吃蛇',   desc:'经典街机', icon:'snake', target:'eatsnake.html' },
    { name:'连连看',   desc:'爱心连线', icon:'lian',  target:'lian.html' },
    { name:'开心消消乐', desc:'三消闯关', icon:'xiao',  target:'xiao.html' },
    { name:'植物大战僵尸', desc:'在线版', icon:'pvz', target:'pvz.html' },
    { name:'天天酷跑', desc:'极速冲刺', icon:'run', target:'coolrun.html' },
    { name:'敬请期待', desc:'即将上线', icon:'soon', target:'' },
  ];
  const PER_PAGE = 6;   // 一页六个（两排三个）
  const ICONS = {
    snake: '<span class="mini-snake"><i></i><i></i><i></i><i></i><i></i></span>',
    lian:  '<span class="i-lian"><b></b><i></i><u></u></span>',
    xiao:  '<span class="i-xiao"><i>🍑</i><i>🫐</i><i>🍈</i></span>',
    pvz:   '<span class="i-pvz"><i></i><b></b></span>',
    run:   '<span class="i-run"><span class="head"></span><span class="body"></span><span class="arm l"></span><span class="arm r"></span><span class="leg l"></span><span class="leg r"></span></span>',
    soon:  '<span class="lock"></span>',
  };

  // ===== 金币拉取 =====
  const coinNum = document.getElementById('coinNum');
  function setCoin(n) {
    coinNum.textContent = n;
    localStorage.setItem('blindbox_coins', String(n));
  }
  setCoin(localStorage.getItem('blindbox_coins') || 0);

  if (!offline && user && pass) {
    fetch(API + '/api/user?username=' + encodeURIComponent(user) + '&password=' + encodeURIComponent(pass), { signal: AbortSignal.timeout(8000) })
      .then(r => r.json())
      .then(d => {
        if (d && d.ok && d.user) {
          setCoin(d.user.coins);
          localStorage.setItem('blindbox_manager', d.user.manager ? '1' : '0');
        }
      })
      .catch(() => {});
  }

  // ===== 渲染游戏墙 =====
  const stage = document.getElementById('stage');
  const pind  = document.getElementById('pind');
  let page = 1;
  const pages = Math.ceil(GAMES.length / PER_PAGE);

  function render(){
    stage.innerHTML = '';
    const start = (page-1)*PER_PAGE;
    GAMES.slice(start, start+PER_PAGE).forEach((g, idx) => {
      const slot = (start + idx) % 6 + 1;
      const box = document.createElement('div');
      box.className = 'box b' + slot + ' enter';
      box.style.animationDelay = (idx*0.07) + 's';
      box.innerHTML =
        '<div class="lid">?</div>' +
        '<div class="body">' +
          '<span class="ribbon"></span>' +
          '<div class="reveal">' +
            ICONS[g.icon] +
            '<span class="r-name">' + g.name + '</span>' +
            (g.target ? '<span class="r-go">进入</span>' : '<span class="soon">敬请期待</span>') +
          '</div>' +
        '</div>';
      box.addEventListener('click', () => {
        if (box.classList.contains('open')) {
          if (g.target) location.href = g.target;
          else toast('敬请期待 · 即将上线');
        } else {
          box.classList.add('open');
        }
      });
      stage.appendChild(box);
    });
    pind.textContent = page + ' / ' + pages;
    document.getElementById('prev').disabled = page <= 1;
    document.getElementById('next').disabled = page >= pages;
  }

  document.getElementById('prev').addEventListener('click', () => { if (page>1){ page--; render(); } });
  document.getElementById('next').addEventListener('click', () => { if (page<pages){ page++; render(); } });
  // 只有一页时隐藏翻页
  if (pages <= 1) document.querySelector('.pager').style.display = 'none';

  document.getElementById('logout').addEventListener('click', () => {
    localStorage.removeItem('blindbox_user');
    localStorage.removeItem('blindbox_pass');
    localStorage.removeItem('blindbox_manager');
    localStorage.removeItem('blindbox_coins');
    localStorage.removeItem('blindbox_offline');
    location.href = 'index.html';
  });

  // 功能入口
  document.getElementById('goRecharge').addEventListener('click', () => location.href = 'recharge.html');
  document.getElementById('goBoard').addEventListener('click', () => location.href = 'board.html#messages');
  document.getElementById('goDiary').addEventListener('click', () => location.href = 'board.html#diary');

  let toastTimer = null;
  function toast(msg){
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(()=>t.classList.remove('show'), 1600);
  }

  // 预览用：main.html?open=1 自动打开第一个盲盒
  if (new URLSearchParams(location.search).get('open') === '1') {
    setTimeout(()=>{ const b = stage.querySelector('.box'); if (b) b.classList.add('open'); }, 500);
  }

  render();
</script>
</body>
</html>
