<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>酷跑 HD · 无尽版</title>
<style>
  :root{
    --gold:#ffd257; --gold2:#ff9b1f; --blue:#5ad1ff; --green:#8ede4a;
    --panel:rgba(11,15,23,.9); --edge:rgba(255,210,87,.34);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
  html,body{margin:0;height:100%;background:#04060b;overflow:hidden;
    font-family:"Microsoft YaHei","PingFang SC","Noto Sans SC",system-ui,sans-serif;color:#eaf0ff;
    touch-action:none;overscroll-behavior:none}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  #stage{position:relative;width:960px;height:540px;transform-origin:center center;
    box-shadow:0 0 0 1px rgba(255,255,255,.07),0 24px 80px rgba(0,0,0,.85);border-radius:10px;overflow:hidden;background:#0a1119}
  canvas{display:block;width:960px;height:540px}

  /* ---------------- HUD ---------------- */
  #hud{position:absolute;inset:0;pointer-events:none;z-index:3;display:none}
  #hud.on{display:block}
  .hl{position:absolute;display:flex;align-items:center;gap:7px;font-weight:900;font-size:21px;
      text-shadow:0 2px 7px rgba(0,0,0,.9),0 0 2px rgba(0,0,0,.9)}
  #hCoin{left:16px;top:11px;color:var(--gold)}
  #hScore{left:170px;top:11px;color:var(--blue)}
  #hDist{left:352px;top:11px;color:#fff}
  .hl img{width:28px;height:28px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.8))}
  .hl small{font-size:12px;opacity:.7;font-weight:700}
  #hBest{position:absolute;right:14px;top:11px;font-size:13px;font-weight:800;color:#ffd257;
         text-shadow:0 2px 6px rgba(0,0,0,.9);opacity:.9}
  #hPause{position:absolute;right:14px;top:38px;pointer-events:auto;cursor:pointer;width:42px;height:42px;
    border-radius:11px;background:rgba(0,0,0,.42);border:1px solid rgba(255,255,255,.16);
    display:flex;align-items:center;justify-content:center;font-size:16px;color:#fff}
  #hPause:active{background:rgba(0,0,0,.7)}

  /* 积分槽 */
  #energyWrap{position:absolute;left:50%;top:12px;transform:translateX(-50%);width:330px}
  #energyLabel{display:flex;justify-content:space-between;font-size:11px;font-weight:800;
    letter-spacing:1px;margin-bottom:3px;text-shadow:0 2px 5px rgba(0,0,0,.9)}
  #energyLabel .l{color:#ffe08a}#energyLabel .r{color:#9fd8ff}
  #energyBar{height:13px;border-radius:7px;background:rgba(0,0,0,.55);
    border:1px solid rgba(255,255,255,.18);overflow:hidden}
  #energyFill{height:100%;width:0;border-radius:6px;
    background:linear-gradient(90deg,#ffb347,#ffd257,#fff3c4);
    transition:width .08s linear}
  #energyBar.full{border-color:#fff3c4;animation:pulse .7s infinite alternate}
  @keyframes pulse{from{box-shadow:0 0 0 rgba(255,220,120,0)}to{box-shadow:0 0 18px rgba(255,220,120,.85)}}
  #energyBar.bonus #energyFill{background:linear-gradient(90deg,#ff7a18,#ffd257,#fff)}

  #buffs{position:absolute;left:16px;top:46px;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
  .bf{padding:3px 11px;border-radius:999px;font-size:12px;font-weight:800;letter-spacing:1px;
    background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.18);text-shadow:0 1px 4px #000}
  #toast{position:absolute;left:50%;top:96px;transform:translateX(-50%);font-size:26px;font-weight:900;
    letter-spacing:4px;color:#ffe9a8;text-shadow:0 4px 16px rgba(0,0,0,.95);opacity:0;transition:opacity .3s;
    white-space:nowrap}
  #combo{position:absolute;left:50%;top:142px;transform:translateX(-50%);font-size:17px;font-weight:900;
    color:var(--green);text-shadow:0 3px 10px rgba(0,0,0,.9);opacity:0;transition:opacity .2s}

  /* ---------------- 触屏按钮 ---------------- */
  #pad{position:absolute;inset:0;z-index:4;display:none}
  #pad.on{display:block}
  .pbtn{position:absolute;bottom:22px;width:132px;height:132px;border-radius:50%;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.20),rgba(255,255,255,.05) 60%,rgba(0,0,0,.28));
    border:2px solid rgba(255,255,255,.34);color:#fff;font-weight:900;letter-spacing:2px;
    box-shadow:0 8px 26px rgba(0,0,0,.5);transition:transform .06s,background .1s;
    pointer-events:auto;cursor:pointer}
  .pbtn .ico{font-size:34px;line-height:1}
  .pbtn .tx{font-size:13px;opacity:.92;margin-top:2px}
  .pbtn:active,.pbtn.hit{transform:scale(.91);
    background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.42),rgba(255,255,255,.16) 60%,rgba(0,0,0,.3))}
  #bSlide{left:24px;border-color:rgba(150,215,255,.62);color:#dff0ff}
  #bJump{right:24px;border-color:rgba(255,215,120,.72);color:#fff6d8}
  #bJump.dbl{border-color:#8ede4a;box-shadow:0 0 24px rgba(142,222,74,.7)}
  #bDash{position:absolute;right:172px;bottom:52px;width:84px;height:84px;border-radius:50%;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:radial-gradient(circle at 35% 30%,rgba(140,225,255,.32),rgba(0,0,0,.3));
    border:2px solid rgba(140,225,255,.6);color:#e8fbff;font-weight:900;letter-spacing:1px;
    pointer-events:auto;cursor:pointer;transition:transform .06s,opacity .15s;font-size:12px}
  #bDash .ico{font-size:24px;line-height:1}
  #bDash:active{transform:scale(.9)}
  #bDash.empty{opacity:.3}
  @media (max-width:820px){
    .pbtn{width:104px;height:104px;bottom:16px}
    .pbtn .ico{font-size:27px}.pbtn .tx{font-size:11px}
    #bSlide{left:14px}#bJump{right:14px}
    #bDash{right:130px;bottom:36px;width:66px;height:66px}
    #bDash .ico{font-size:19px}
  }

  /* ---------------- 覆盖层 ---------------- */
  .ov{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;
      background:linear-gradient(165deg,rgba(7,11,18,.93),rgba(13,19,32,.97));z-index:6;padding:20px}
  .ov.on{display:flex}
  .ov h1{margin:0 0 4px;font-size:52px;letter-spacing:10px;font-weight:900;
    background:linear-gradient(180deg,#fff6d0,#ffc93c 55%,#ff8a00);-webkit-background-clip:text;background-clip:text;
    color:transparent;text-shadow:0 8px 30px rgba(255,160,0,.35)}
  .ov .sub{opacity:.62;font-size:13px;letter-spacing:3px;margin-bottom:20px;text-align:center}
  .btn{cursor:pointer;border:1px solid var(--edge);border-radius:12px;padding:13px 34px;font-size:17px;
    font-weight:900;letter-spacing:3px;color:#ffe9b0;
    background:linear-gradient(180deg,rgba(255,210,87,.20),rgba(255,140,0,.10));transition:.15s;
    pointer-events:auto}
  .btn:hover{background:linear-gradient(180deg,rgba(255,210,87,.36),rgba(255,140,0,.2));transform:translateY(-1px)}
  .btn:active{transform:translateY(1px) scale(.98)}
  .btn.ghost{border-color:rgba(255,255,255,.22);color:#cfe0ff;background:rgba(255,255,255,.05)}
  .row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;align-items:center}

  #themes{display:flex;gap:10px;margin:6px 0 20px;flex-wrap:wrap;justify-content:center;max-width:880px}
  .th{cursor:pointer;width:128px;border-radius:12px;overflow:hidden;border:2px solid rgba(255,255,255,.16);
    background:rgba(255,255,255,.04);transition:.15s;pointer-events:auto}
  .th:hover{border-color:rgba(255,210,87,.6);transform:translateY(-2px)}
  .th.on{border-color:var(--gold);box-shadow:0 0 20px rgba(255,200,60,.4)}
  .th img{display:block;width:100%;height:62px;object-fit:cover}
  .th .n{font-size:12px;font-weight:800;padding:5px 0 6px;text-align:center;letter-spacing:1px}

  #over .card{width:568px;padding:26px 30px;border-radius:18px;background:var(--panel);
    border:1px solid rgba(255,255,255,.1);text-align:center}
  #over .big{font-size:56px;font-weight:900;letter-spacing:3px;
    background:linear-gradient(180deg,#fff6d0,#ffc93c 60%,#ff8a00);-webkit-background-clip:text;background-clip:text;color:transparent}
  #over .big small{font-size:22px}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0 8px}
  .stat{padding:11px 6px;border-radius:12px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08)}
  .stat .k{font-size:11px;opacity:.6;letter-spacing:2px}
  .stat .v{font-size:24px;font-weight:900;margin-top:3px}
  .nb{min-height:20px;font-size:14px;letter-spacing:3px;font-weight:900;color:var(--green);margin-bottom:14px}
  .tip{margin-top:16px;font-size:12px;opacity:.5;letter-spacing:1px;line-height:1.9}
  kbd{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:5px;
    padding:1px 7px;font-family:inherit;font-size:12px}

  #load{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:#070b12;z-index:9}
  #load .logo{font-size:38px;font-weight:900;letter-spacing:12px;
    background:linear-gradient(180deg,#fff3c4,#ffc93c 55%,#ff8a00);-webkit-background-clip:text;background-clip:text;color:transparent}
  #load .bar{width:360px;height:9px;border-radius:5px;background:rgba(255,255,255,.1);overflow:hidden;margin-top:18px}
  #load .fill{height:100%;width:0;background:linear-gradient(90deg,#ffd257,#ff8a00);transition:width .15s}
  #load .t{margin-top:11px;font-size:12px;opacity:.55;letter-spacing:2px}
  #err{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:#14060a;z-index:20;
    color:#ffb4b4;font-size:14px;text-align:center;padding:44px;line-height:1.8}
</style>
</head>
<body>
<div id="wrap"><div id="stage">
  <canvas id="cv" width="960" height="540"></canvas>

  <div id="hud">
    <div class="hl" id="hCoin"><img id="icoCoin" alt=""><span>0</span></div>
    <div class="hl" id="hScore"><span>0</span><small>分</small></div>
    <div class="hl" id="hDist"><span>0</span><small>m</small></div>
    <div id="hBest">最佳 0</div>
    <div id="hPause">❚❚</div>
    <div id="energyWrap">
      <div id="energyLabel"><span class="l">积分</span><span class="r" id="energyHint">集满进金币关</span></div>
      <div id="energyBar"><div id="energyFill"></div></div>
    </div>
    <div id="buffs"></div>
    <div id="toast"></div>
    <div id="combo"></div>
  </div>

  <div id="pad">
    <div class="pbtn" id="bSlide"><span class="ico">🛷</span><span class="tx">蹲</span></div>
    <div class="pbtn" id="bJump"><span class="ico">🦶</span><span class="tx">跳</span></div>
    <div id="bDash"><span class="ico">⚡</span><span>冲刺</span></div>
  </div>

  <div class="ov on" id="title">
    <h1>酷 跑 HD</h1>
    <div class="sub">无 尽 版 · 74 张真实 TMX 拼接 · 春夏秋冬 + 新春特辑</div>
    <div id="themes"></div>
    <div class="row"><div class="btn" id="btnStart">开 始 跑 酷</div></div>
    <div class="tip">
      <kbd>空格</kbd>/<kbd>↑</kbd> 跳（空中再按 = <b>二段跳</b>） · <kbd>↓</kbd> 蹲 · <kbd>Shift</kbd> 冲刺 · <kbd>M</kbd> 静音<br>
      手机：左下角<b>蹲</b>，右下角<b>跳</b>（连点两下 = 冲刺）
    </div>
  </div>

  <div class="ov" id="pause">
    <h1 style="font-size:36px;letter-spacing:8px">暂 停</h1>
    <div class="row" style="margin-top:14px">
      <div class="btn" id="btnResume">继 续</div>
      <div class="btn ghost" id="btnRestart">重 开</div>
      <div class="btn ghost" id="btnQuit">回 主 菜 单</div>
    </div>
  </div>

  <div class="ov" id="over">
    <div class="card">
      <div style="font-size:15px;letter-spacing:8px;opacity:.62">游 戏 结 束</div>
      <div class="big" id="ovScore">0<small>分</small></div>
      <div class="nb" id="ovNB"></div>
      <div class="stats">
        <div class="stat"><div class="k">吃到的币</div><div class="v" id="ovCoin" style="color:var(--gold)">0</div></div>
        <div class="stat"><div class="k">跑了</div><div class="v" id="ovDist" style="color:#fff">0<small style="font-size:14px">m</small></div></div>
        <div class="stat"><div class="k">最高连击</div><div class="v" id="ovCombo" style="color:var(--green)">0</div></div>
      </div>
      <div class="row">
        <div class="btn" id="btnRetry">再 来 一 次</div>
        <div class="btn ghost" id="btnHome">回 主 菜 单</div>
      </div>
      <div class="tip" id="ovTip"></div>
    </div>
  </div>

  <div id="load">
    <div class="logo">酷跑 HD</div>
    <div class="bar"><div class="fill" id="ldFill"></div></div>
    <div class="t" id="ldTxt">正在读取素材…</div>
  </div>
  <div id="err"></div>
</div></div>

<script src="assets/levels_tmx.js"></script>
<script src="assets/hero/hero.js"></script>
<script>
(function () {
'use strict';

/* 全局错误可视化：脚本一炸就直接显示出来，不用开 F12 */
window.onerror = function (m, s, l, c) {
  var e = document.getElementById('err');
  if (e) {
    e.style.display = 'flex';
    e.innerHTML = '<div><b style="font-size:16px">脚本错误</b><br><br>' + m +
      '<br><span style="opacity:.6;font-size:12px">' + (s || '') + ':' + l + ':' + c + '</span></div>';
  }
  return false;
};
window.addEventListener('unhandledrejection', function (ev) {
  var e = document.getElementById('err');
  if (e) {
    e.style.display = 'flex';
    e.innerHTML = '<div><b style="font-size:16px">Promise 未处理异常</b><br><br>' +
      (ev.reason && ev.reason.message ? ev.reason.message : String(ev.reason)) + '</div>';
  }
});

/* =====================================================================
   0. 常量
   ===================================================================== */
var VW = 960, VH = 540, TILE = 40;
var GROUND_Y = 480;
var TWO_PI = Math.PI * 2;
var clamp = function (v, a, b) { return v < a ? a : v > b ? b : v; };
var lerp = function (a, b, t) { return a + (b - a) * t; };
var rnd = function (a, b) { return a + Math.random() * (b - a); };
var rint = function (a, b) { return Math.floor(a + Math.random() * (b - a + 1)); };
var now = function () { return performance.now() / 1000; };

var P = {
  SPEED_BASE: 430, SPEED_MAX: 760, SPEED_RAMP: 0.9,
  GRAVITY: 1700, JUMP_V: 665, JUMP_V2: 585,
  MAX_FALL: 1250, COYOTE: 0.11, JUMP_BUF: 0.15,
  CUT_MUL: 0.45, FASTFALL_MUL: 1.75,
  DASH_MUL: 1.8, DASH_TIME: 0.55, DASH_CD: 0.9,
  HB_W: 34, HB_H: 52, SLIDE_H: 30,
  ENERGY_PER_COIN: 1.15, ENERGY_PER_M: 0.028,
  BONUS_TIME: 12.0, THEME_EVERY: 620
};

function qs(n) { var m = new RegExp('[?&]' + n + '=([^&]*)').exec(location.search); return m ? decodeURIComponent(m[1]) : null; }
var DEBUG = qs('debug') === '1';
var AUTOPILOT = qs('auto') === '1' || qs('shot') === '1';
var SEEK = parseFloat(qs('seek') || '0') || 0;
var KILLAT = parseFloat(qs('kill') || '0') || 0;
var FORCE_BONUS = qs('bonus') === '1';
var PAD_ALWAYS = qs('pad') === '1';

/* =====================================================================
   1. 资源表
   ===================================================================== */
var IMG_SRC = {
  run:'assets/hero/run.png', jump:'assets/hero/jump.png', fall:'assets/hero/fall.png',
  slide:'assets/hero/slide.png', fly:'assets/hero/fly.png',
  tSpring:'assets/map/map1/land_1(1).png',
  tSummer:'assets/map/map3/land_1(1).png',
  tAutumn:'assets/map/map2/land_1(1).png',
  tNight:'assets/map/acrossMap/land_1(1).png',
  tNewyer:'assets/map/map1/land_1(1).png',
  bSpring1:'assets/map/map1/sbg1.png', bSpring2:'assets/map/map1/sbg2.png', bSpring3:'assets/map/map1/sbg3.png',
  bSummer1:'assets/map/map3/sbg1.png', bSummer2:'assets/map/map3/sbg2.png', bSummer3:'assets/map/map3/sbg3.png',
  bAutumn1:'assets/map/map2/sbg1.png', bAutumn2:'assets/map/map2/sbg2.png', bAutumn3:'assets/map/map2/sbg3.png',
  bNight1:'assets/map/acrossMap/5.png', bNight2:'assets/map/acrossMap/2.png',
  bSuper1:'assets/map/superMap/bg_0.png', bSuper2:'assets/map/superMap/bg_002.png', bSuper3:'assets/map/superMap/bg_003.png',
  bGold:'assets/GameBg/jiesuanBg.png',
  bRainbow:'assets/map/acrossMap/rainbow.png',
  landX:'assets/map/map1/land_x.png',
  coin:'assets/spr/coin.png', coinSilver:'assets/spr/coin_silver.png', coinCopper:'assets/spr/coin_red.png',
  icoGold:'assets/prop/Y01.png',
  monster:'assets/spr/monster.png', rocket:'assets/spr/rocket.png', spike:'assets/spr/spike.png',
  spring:'assets/spr/spring.png', crate:'assets/prop/box.png',
  magnet:'assets/prop/p-1.png', gem:'assets/prop/d-1.png', dashIco:'assets/fx/chongci.png',
  shield:'assets/fx/shield-001.png', shadow:'assets/fx/shadow.png',
  trail:'assets/prop/tiao-3.png', rush:'assets/fx/rush.png'
};
var SFX_SRC = {
  jump:'assets/audio/4_jump.mp3', jump2:'assets/audio/8_second_jump_boy.mp3',
  land:'assets/audio/6_landing.mp3', coin:'assets/audio/0_get_star_04.mp3',
  coin2:'assets/audio/1_get_star_05.mp3', item:'assets/audio/19_get_item.mp3',
  magnet:'assets/audio/10_magnet.mp3', spring:'assets/audio/14_spring.mp3',
  rush:'assets/audio/11_rush.mp3', speed:'assets/audio/18_speedup.mp3',
  fever:'assets/audio/24_fevertime.mp3', hit:'assets/audio/12_shell_break.mp3',
  kill:'assets/audio/13_monster_break.mp3', dead:'assets/audio/25_game_over.mp3',
  ready:'assets/audio/27_readygo.mp3', levelup:'assets/audio/26_level_up.mp3',
  warn:'assets/audio/15_alert.mp3', pause:'assets/audio/22_pause.mp3', click:'assets/audio/20_btn_click_item.mp3'
};
var BGM_NORMAL = 'assets/audio/28_bgm.mp3';
var BGM_BONUS = 'assets/audio/24_fevertime.mp3';

var THEMES = [
  { id:'spring', name:'春 · 森林', tiles:'tSpring', tint:null,
    bg:[{k:'bSpring1',p:.10,o:0,s:1},{k:'bSpring2',p:.28,o:-8,s:1},{k:'bSpring3',p:.55,o:0,s:1}] },
  { id:'summer', name:'夏 · 碧海', tiles:'tSummer', tint:null,
    bg:[{k:'bSummer1',p:.10,o:0,s:1},{k:'bSummer2',p:.28,o:-6,s:1},{k:'bSummer3',p:.55,o:0,s:1}] },
  { id:'autumn', name:'秋 · 黄沙', tiles:'tAutumn', tint:null,
    bg:[{k:'bAutumn1',p:.10,o:0,s:1},{k:'bAutumn2',p:.28,o:-6,s:1},{k:'bAutumn3',p:.55,o:0,s:1}] },
  { id:'night', name:'冬 · 星海', tiles:'tNight', tint:'rgba(40,50,130,.20)',
    bg:[{k:'bNight1',p:.10,o:0,s:1},{k:'bNight2',p:.34,o:0,s:1},{k:'bSpring3',p:.60,o:0,s:1}] },
  { id:'newyear', name:'新春特辑', tiles:'tNewyer', tint:'rgba(255,150,40,.10)',
    bg:[{k:'bSuper1',p:.10,o:0,s:1},{k:'bSuper2',p:.30,o:200,s:1},{k:'bSuper3',p:.55,o:0,s:1}] }
];
var BONUS_BG = [{k:'bGold',p:.14,o:-140,s:1.6},{k:'bSuper1',p:.36,o:0,s:1},{k:'bRainbow',p:.58,o:180,s:1}];
var BONUS_THEME = { id:'bonus', name:'金币关', tiles:'tAutumn', tint:'rgba(255,180,40,.12)', bg:BONUS_BG };

/* =====================================================================
   2. 加载
   ===================================================================== */
var IMG = {}, ldDone = 0, ldTotal = 0;
function mark(t) {
  ldDone++;
  document.getElementById('ldFill').style.width = Math.round(ldDone / ldTotal * 100) + '%';
  if (t) document.getElementById('ldTxt').textContent = t;
}
function fatal(m) {
  var e = document.getElementById('err');
  e.style.display = 'flex'; e.innerHTML = m;
  document.getElementById('load').style.display = 'none';
}
function loadAll(cb) {
  var keys = Object.keys(IMG_SRC);
  ldTotal = keys.length + 3;
  var left = keys.length;
  keys.forEach(function (k) {
    var im = new Image();
    im.onload = function () { IMG[k] = im; mark(); if (--left === 0) fin(); };
    im.onerror = function () { IMG[k] = null; mark('缺图 ' + k); if (--left === 0) fin(); };

          if (!e.hitT) { e.hitT = 0.5; sfx('kill'); ftext(e.x + e.w / 2, e.y, '撞碎!', '#8ede4a'); G.score += 100; }
        } else return die(e.k === 'spike' ? '扎到地刺' : '撞上障碍');
      }
      if (e.hitT > 0) e.hitT -= dt;
    }
  }
  return null;
}

/* =====================================================================
   9. 主循环
   ===================================================================== */
function rechargeDash() {
  if (!G) return;
  var atm = Math.floor(G.dist / 120);
  if (G._dashM === undefined) G._dashM = atm;
  if (atm > G._dashM) {
    G._dashM = atm;
    if (G.dashCharge < 3) { G.dashCharge++; toast('冲 刺 +1', '#9fe8ff'); sfx('item'); }
  }
}
function tick(ts) {
  rafId = requestAnimationFrame(tick);
  if (!lastT) lastT = ts;
  var dt = (ts - lastT) / 1000; lastT = ts;
  if (dt > 0.1) dt = 0.1;

  if (state === 'play' && G) {
    acc += dt;
    var step = 1 / 120, guard = 0;
    while (acc >= step && guard++ < 8) {
      if (!G.dead) {
        if (AUTOPILOT) autopilot();
        if (KILLAT > 0 && G.t > KILLAT) die('测试');
        physics(step);
        if (!G.dead) updateEntities(step);
        if (!G.bonus) addEnergy(P.ENERGY_PER_M * (speedNow() * step) / 40);
        IN.jumpEdge = false; IN.dashEdge = false;
      } else {
        G.deadT += step;
        G.player.vy += P.GRAVITY * step;
        G.player.y += G.player.vy * step;
        G.player.x += 90 * step;
      }
      G.t += step;
      acc -= step;
    }
    if (!G.dead) {
      G.dist = Math.max(G.dist, (G.player.x - 80) / 40);
      rechargeDash();
      G.dustT -= dt;
      if (G.player.onGround && G.dustT <= 0) { G.dustT = 0.085; puff(1); }
      extendTrack();
    } else if (G.deadT > 1.1) {
      state = 'over'; showResult();
    }
  }

  updateCam(dt);
  updateParts(dt);
  render();
  updateHud();
}
function updateCam(dt) {
  if (!G) return;
  var p = G.player;
  var tx = p.x - VW * 0.30;
  var ty = clamp(p.y + P.HB_H * 0.5 - 330, GROUND_Y - 470, GROUND_Y - 340);
  if (!p.onGround && p.vy > 0) ty += 26;
  cam.x = lerp(cam.x, tx, 1 - Math.pow(0.0015, dt));
  cam.y = lerp(cam.y, ty, 1 - Math.pow(0.004, dt));
  if (cam.x < 0) cam.x = 0;
  if (cam.shake > 0) cam.shake = Math.max(0, cam.shake - dt * 34);
}
function updateParts(dt) {
  for (var i = parts.length - 1; i >= 0; i--) {
    var q = parts[i]; q.life -= dt;
    if (q.life <= 0) { parts.splice(i, 1); continue; }
    q.x += q.vx * dt; q.y += q.vy * dt; q.vy += 420 * dt; q.vx *= 0.985;
  }
  for (var j = floats.length - 1; j >= 0; j--) { var f = floats[j]; f.t += dt; if (f.t > f.life) floats.splice(j, 1); }
}

/* =====================================================================
   10. 渲染
   ===================================================================== */
var ctx = document.getElementById('cv').getContext('2d');
function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, VW, VH);
  if (!G) { ctx.fillStyle = '#080d16'; ctx.fillRect(0, 0, VW, VH); return; }
  var shx = cam.shake ? rnd(-cam.shake, cam.shake) : 0;
  var shy = cam.shake ? rnd(-cam.shake, cam.shake) : 0;
  ctx.save(); ctx.translate(shx, shy);
  drawBg();
  ctx.save();
  ctx.translate(-Math.round(cam.x), -Math.round(cam.y));
  drawTrack();
  drawEntities();
  drawPlayer();
  drawParts();
  if (DEBUG) drawDebug();
  ctx.restore();
  if (G.bonus) {
    ctx.globalAlpha = 0.10 + Math.sin(G.t * 4) * 0.03;
    ctx.fillStyle = '#ffb300'; ctx.fillRect(0, 0, VW, VH);
    ctx.globalAlpha = 1;
  }
  ctx.restore();
  drawVignette();
}
function drawBg() {
  var theme = G.bonus ? BONUS_THEME : curTheme;
  var list = theme.bg || BONUS_BG;
  for (var i = 0; i < list.length; i++) {
    var L = list[i], im = IMG[L.k];
    if (!im) continue;
    var sc = L.s || 1;
    var w = im.width * (VH / im.height) * sc, h = VH * sc;
    var base = -(cam.x * L.p) % w;
    if (base > 0) base -= w;
    for (var k = -1; k < VW / w + 2; k++) {
      ctx.drawImage(im, Math.round(base + k * w),
        Math.round((L.o || 0) - cam.y * L.p * 0.42), Math.round(w), Math.round(h));
    }
  }
  if (theme.tint) { ctx.fillStyle = theme.tint; ctx.fillRect(0, 0, VW, VH); }
}
function drawTrack() {
  var x0 = cam.x - 60, x1 = cam.x + VW + 60;
  for (var i = 0; i < SEG.length; i++) {
    var s = SEG[i];
    if (s.x1 < x0 || s.x0 > x1) continue;
    var ts = themeTileset(s.theme || curTheme);
    var n = ts.cols * ts.rows;
    for (var j = 0; j < s.visual.length; j++) {
      var v = s.visual[j];
      if (v.x < x0 - 40 || v.x > x1) continue;
      if (!ts.img) { ctx.fillStyle = '#3a5a2a'; ctx.fillRect(v.x, v.y, TILE, TILE); continue; }
      var idx = ((v.g - 1) % n + n) % n;
      ctx.drawImage(ts.img, (idx % ts.cols) * TILE, Math.floor(idx / ts.cols) * TILE, TILE, TILE, v.x, v.y, TILE, TILE);
    }
    if (s.lv) {
      for (var e = 0; e < s.lv.extra.length; e++) {
        var ex = s.lv.extra[e];
        if (ex[0] < s.a || ex[0] > s.b) continue;
        var wx = s.x0 + (ex[0] - s.a) * TILE, wy = ex[1] * TILE + s.dz;
        if (wx < x0 - 40 || wx > x1) continue;
        if (ex[2] === 5) { if (IMG.crate) ctx.drawImage(IMG.crate, wx, wy, TILE, TILE); }
        else if (ts.img) {
          var ii = ex[3] === 1 ? 0 : ts.cols;
          ctx.drawImage(ts.img, (ii % ts.cols) * TILE, Math.floor(ii / ts.cols) * TILE, TILE, TILE, wx, wy, TILE, TILE);
        }
      }
    }
  }
}
function drawEntities() {
  var t = G.t, x0 = cam.x - 60, x1 = cam.x + VW + 60;
  var list = entsNear(x0, x1);
  for (var i = 0; i < list.length; i++) {
    var e = list[i];
    if (e.dead) continue;
    if (e.x + (e.w || 60) < x0 || e.x > x1 + 60) continue;
    if (e.t === 'coin') {
      var im = e.k === 2 ? IMG.coinSilver : (e.k === 3 ? IMG.coinCopper : IMG.coin);
      if (!im) continue;
      var s = 1 + Math.sin(t * 4 + e.ph) * 0.10;
      var sx = Math.abs(Math.cos(t * 3.2 + e.ph)) * 0.62 + 0.38;
      ctx.save(); ctx.translate(e.x, e.y + Math.sin(t * 3 + e.ph) * 3); ctx.scale(sx * s, s);
      ctx.drawImage(im, -im.width / 2, -im.height / 2); ctx.restore();
    } else if (e.t === 'hazard') {
      var cell = Math.max(1, Math.round(e.w / TILE)), cw = e.w / cell;
      if (e.hitT > 0) ctx.globalAlpha = 0.3;
      if (e.k === 'spike' && IMG.spike) {
        var sh = Math.min(cw, e.h + 6);
        for (var a = 0; a < cell; a++) ctx.drawImage(IMG.spike, e.x + a * cw, e.y + e.h - sh, cw, sh);
      } else if (IMG.crate) {
        var ch = Math.min(Math.max(e.h, 28), cw);
        for (var b = 0; b < cell; b++) ctx.drawImage(IMG.crate, e.x + b * cw, e.y + e.h - ch, cw, ch);
      }
      ctx.globalAlpha = 1;
    } else if (e.t === 'pad') {
      if (IMG.spring) ctx.drawImage(IMG.spring, e.x + e.w / 2 - 22, e.y + e.h - 56, 44, 56);
    } else if (e.t === 'oneway') {
      if (IMG.landX) {
        ctx.drawImage(IMG.landX, e.x, e.y - 2, e.w, 42);
        ctx.globalAlpha = .22; ctx.fillStyle = '#fff'; ctx.fillRect(e.x, e.y - 2, e.w, 3); ctx.globalAlpha = 1;
      }
    } else if (e.t === 'item') {
      var im2 = e.k === 20 ? IMG.magnet : (e.k === 22 ? IMG.dashIco : (e.k === 24 ? IMG.shield : IMG.gem));
      if (!im2) continue;
      var yy = e.y + Math.sin(t * 2.6 + e.ph) * 4;
      ctx.save(); ctx.translate(e.x, yy);
      var sc2 = 0.62 + Math.sin(t * 3 + e.ph) * 0.05;
      if (e.k === 24) { ctx.rotate(t * 1.2); sc2 = 0.24; }
      ctx.scale(sc2, sc2); ctx.globalAlpha = .96; ctx.drawImage(im2, -im2.width / 2, -im2.height / 2); ctx.restore();
      ctx.globalAlpha = 1;
      var gg = ctx.createRadialGradient(e.x, yy, 2, e.x, yy, 30);
      gg.addColorStop(0, e.k === 22 ? 'rgba(120,224,255,.5)' : (e.k === 24 ? 'rgba(180,140,255,.45)' : 'rgba(255,220,120,.4)'));
      gg.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = gg; ctx.beginPath(); ctx.arc(e.x, yy, 30, 0, TWO_PI); ctx.fill();
    } else if (e.t === 'walker') {
      if (!IMG.monster) continue;
      var bob = Math.sin(e.ph * 2) * 2, sc3 = e.h / IMG.monster.height * 1.25;
      ctx.save(); ctx.translate(e.x + e.w / 2, e.y + e.h + bob); ctx.scale(sc3, sc3);
      ctx.drawImage(IMG.monster, -IMG.monster.width / 2, -IMG.monster.height); ctx.restore();
    } else if (e.t === 'flyer') {
      if (!IMG.rocket) continue;
      var w2 = e.w * 1.15, h2 = w2 * IMG.rocket.height / IMG.rocket.width;
      ctx.save(); ctx.translate(e.x + e.w, e.y + e.h / 2); ctx.scale(-1, 1);
      ctx.drawImage(IMG.rocket, 0, -h2 / 2, w2, h2); ctx.restore();
    }
  }
}
var HERO = null;
function heroMeta() {
  if (HERO) return HERO;
  HERO = (window.COOLRUN_HERO && window.COOLRUN_HERO.anims) || null;
  return HERO;
}
function drawSheet(key, frame, cx, cy, scale, rot, alpha) {
  var meta = heroMeta(); if (!meta || !meta[key]) return false;
  var im = IMG[key]; if (!im) return false;
  var m = meta[key], n = m.frames;
  var f = ((frame % n) + n) % n;
  ctx.save();
  ctx.translate(cx, cy);
  if (rot) ctx.rotate(rot);
  ctx.globalAlpha = alpha == null ? 1 : alpha;
  ctx.drawImage(im, f * m.fw, 0, m.fw, m.fh,
                -m.anchorX * scale, -m.anchorY * scale, m.fw * scale, m.fh * scale);
  ctx.restore();
  return true;
}
function drawPlayer() {
  var p = G.player;
  if (!p.alive && G.deadT > 0.65) return;
  var dashing = G.dashT > 0;
  var meta = heroMeta();
  var runN = meta && meta.run ? meta.run.frames : 12;
  if (IMG.shadow) {
    var gy = groundBelow(p.x + P.HB_W / 2);
    if (gy != null) {
      var d2 = clamp(1 - (gy - (p.y + P.HB_H)) / 280, 0.1, 1);
      ctx.globalAlpha = 0.32 * d2;
      var sw = 56 * d2, sh = 14 * d2;
      ctx.drawImage(IMG.shadow, p.x + P.HB_W / 2 - sw / 2, gy - sh / 2, sw, sh);
      ctx.globalAlpha = 1;
    }
  }
  if (dashing && IMG.trail) {
    var fade = clamp(G.dashT / P.DASH_TIME, 0, 1);
    for (var i = 0; i < 3; i++) {
      ctx.globalAlpha = (0.34 - i * 0.10) * fade;
      ctx.drawImage(IMG.trail, p.x - 26 - i * 40, p.y + 16 + i * 5, 116 - i * 10, 20 - i * 3);
    }
    ctx.globalAlpha = 1;
  }
  if (G.shieldT > 0 && IMG.shield) {
    ctx.globalAlpha = 0.3 + Math.sin(G.t * 10) * 0.1;
    var s2 = 118 + Math.sin(G.t * 5) * 8;
    ctx.drawImage(IMG.shield, p.x + P.HB_W / 2 - s2 / 2, p.y + P.HB_H / 2 - s2 / 2, s2, s2);
    ctx.globalAlpha = 1;
  }
  if (G.magnetT > 0) {
    ctx.strokeStyle = 'rgba(140,220,255,' + (0.25 + Math.sin(G.t * 8) * 0.1) + ')';
    ctx.lineWidth = 2; ctx.beginPath();
    ctx.arc(p.x + P.HB_W / 2, p.y + P.HB_H / 2, 46 + Math.sin(G.t * 6) * 4, 0, TWO_PI); ctx.stroke();
  }
  var scale = G.giantT > 0 ? 1.32 : 1;
  var cx = p.x + P.HB_W / 2, cy = p.y + P.HB_H;
  var rot = 0, key = 'run', frame = 0;
  if (p.sliding) {
    key = 'slide';
    frame = Math.floor(G.t * 14) % Math.max(1, (meta && meta.slide ? meta.slide.frames : 6));
  } else if (!p.onGround) {
    if (p.vy < -40 && p.jumps >= 1) {
      key = 'jump';
      frame = Math.floor(G.t * 16) % Math.max(1, (meta && meta.jump ? meta.jump.frames : 6));
    } else {
      key = 'fall';
      frame = Math.floor(G.t * 10) % Math.max(1, (meta && meta.fall ? meta.fall.frames : 4));
    }
    if (p.spinT > 0) rot += p.spin * (1 - p.spinT / 0.42);
    if (p.vy < 0) rot -= 0.10;
  } else {
    key = 'run';
    frame = Math.floor(G.t * (dashing ? 26 : 15)) % Math.max(1, runN);
    rot = -0.04;
  }
  if (!drawSheet(key, frame, cx, cy, scale, rot, p.alive ? 1 : 0.85)) {
    ctx.fillStyle = '#8ede4a'; ctx.fillRect(p.x, p.y, P.HB_W, P.HB_H);
  }
  if (dashing && IMG.rush) {
    ctx.globalAlpha = clamp(G.dashT / P.DASH_TIME, 0, 1) * 0.4;
    ctx.drawImage(IMG.rush, p.x - 130, p.y - 60, 260, 180);
    ctx.globalAlpha = 1;
  }
}
function groundBelow(x) {
  var r = hitSolid(x, cam.y + 4, 2, 2400);
  return r ? r.y : null;
}
function drawParts() {
  for (var i = 0; i < parts.length; i++) {
    var q = parts[i];
    ctx.globalAlpha = clamp(q.life / q.max, 0, 1);
    ctx.fillStyle = q.c;
    ctx.beginPath(); ctx.arc(q.x, q.y, q.s, 0, TWO_PI); ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.textAlign = 'center';
  for (var j = 0; j < floats.length; j++) {
    var f = floats[j], a = 1 - f.t / f.life;
    ctx.globalAlpha = a;
    ctx.font = 'bold 20px "Microsoft YaHei",sans-serif';
    ctx.fillStyle = 'rgba(0,0,0,.65)'; ctx.fillText(f.txt, f.x + 1, f.y - f.t * 46 + 1);
    ctx.fillStyle = f.c; ctx.fillText(f.txt, f.x, f.y - f.t * 46);
  }
  ctx.globalAlpha = 1; ctx.textAlign = 'left';
}
function drawDebug() {
  ctx.strokeStyle = 'rgba(255,80,80,.5)'; ctx.lineWidth = 1;
  for (var i = 0; i < SEG.length; i++) {
    var s = SEG[i];
    if (s.x1 < cam.x - 40 || s.x0 > cam.x + VW + 40) continue;
    for (var j = 0; j < s.rects.length; j++) {
      var r = s.rects[j];
      if (r.x > cam.x + VW + 40 || r.x + r.w < cam.x - 40) continue;
      ctx.strokeRect(r.x + .5, r.y + .5, r.w - 1, r.h - 1);
    }
  }
  ctx.strokeStyle = 'rgba(80,255,160,.9)';
  for (var k = 0; k < SEG.length; k++) {
    var sg = SEG[k];
    if (sg.x1 < cam.x - 40 || sg.x0 > cam.x + VW + 40) continue;
    for (var m = 0; m < sg.ents.length; m++) {
      var e = sg.ents[m];
      if (e.t === 'oneway') ctx.strokeRect(e.x + .5, e.y + .5, e.w - 1, (e.h || 16) - 1);
    }
  }
  ctx.lineWidth = 2; ctx.strokeStyle = '#00ffcc';
  var p = G.player, ph = p.sliding ? P.SLIDE_H : P.HB_H;
  ctx.strokeRect(p.x + .5, p.y + (P.HB_H - ph) + .5, P.HB_W - 1, ph - 1);
  ctx.strokeStyle = 'rgba(255,255,0,.45)';
  for (var q = 0; q < SEG.length; q++) {
    ctx.beginPath(); ctx.moveTo(SEG[q].x0, cam.y); ctx.lineTo(SEG[q].x0, cam.y + VH); ctx.stroke();
  }
}
function drawVignette() {
  var g = ctx.createRadialGradient(VW / 2, VH / 2, VH * 0.44, VW / 2, VH / 2, VH * 0.95);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,.40)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, VW, VH);
}

  if (FORCE_BONUS) enterBonus();
}
function retry() { showOv(null); startRun(); }
function togglePause() {
  if (state === 'play') { state = 'pause'; showOv('pause'); sfx('pause'); }
  else if (state === 'pause') { state = 'play'; showOv(null); }
}
function fastForward(sec) {
  var step = 1 / 120, n = Math.min(Math.round(sec / step), 120 * 600);
  for (var i = 0; i < n; i++) {
    try {
      if (G.dead) {
        G.deadT += step; G.player.vy += P.GRAVITY * step;
        G.player.y += G.player.vy * step; G.player.x += 90 * step;
        if (G.deadT > 1.1) { state = 'over'; showResult(); break; }
        continue;
      }
      if (AUTOPILOT) autopilot();
      if (KILLAT > 0 && G.t > KILLAT) { die('测试'); continue; }
      physics(step);
      if (!G.dead) updateEntities(step);
      if (!G.bonus) addEnergy(P.ENERGY_PER_M * (speedNow() * step) / 40);
      IN.jumpEdge = false; IN.dashEdge = false;
      G.t += step;
      G.dist = Math.max(G.dist, (G.player.x - 80) / 40);
      rechargeDash();
      cam.x = Math.max(0, G.player.x - VW * 0.30);   // 快进时同步相机，轨道才会继续生成
      extendTrack();
    } catch (er) {
      ai.err = (ai.err || '') + 'ff@' + Math.round(G.t * 10) / 10 + ':' + er.message + ';';
      break;
    }
  }
  cam.x = Math.max(0, G.player.x - VW * 0.30);
  cam.y = clamp(G.player.y + P.HB_H * 0.5 - 330, GROUND_Y - 470, GROUND_Y - 340);
}
function fitStage() {
  var st = document.getElementById('stage');
  var s = Math.min(innerWidth / VW, innerHeight / VH);
  st.style.transform = 'scale(' + s + ')';
}
addEventListener('resize', fitStage);

function boot() {
  loadSave();
  fitStage();
  bindInput();
  bindPad();
  loadAll(function () {
    buildThemes();
    document.getElementById('btnStart').onclick = startRun;
    document.getElementById('btnResume').onclick = togglePause;
    document.getElementById('btnRestart').onclick = function () { showOv(null); startRun(); };
    document.getElementById('btnQuit').onclick = function () {
      state = 'title'; stopBgm(); showOv('title'); buildThemes();
    };
    document.getElementById('btnRetry').onclick = retry;
    document.getElementById('btnHome').onclick = function () { state = 'title'; stopBgm(); showOv('title'); buildThemes(); };
    document.getElementById('hPause').onclick = togglePause;
    if (!Object.keys(window.COOLRUN_TMX || {}).length) {
      fatal('没有读到关卡数据：<code>assets/levels_tmx.js</code> 没加载。');
      return;
    }
    var lids = Object.keys(window.COOLRUN_TMX);
    var done = 0;
    var chain = Promise.resolve();
    lids.forEach(function (lid) {
      chain = chain.then(function () { return parseTMX(lid); }).then(function (lv) {
        for (var i = 0; i < lv.wins.length; i++) {
          var w = lv.wins[i];
          // 池过滤：坑（无底/深坠）<= 8 列（单跳+二段可稳过），台阶 <= 2 格（一跳可上），危险实体连片 <= 8 列（冲刺可穿）
          if (w.gap > 8 || w.wall > 2 || w.hzW > 8) continue;
          POOL.push({ lid:lid, a:w.a, b:w.b, base:w.base, ec:w.ec });
        }
        done++;
        document.getElementById('ldTxt').textContent =
          '解析关卡 ' + done + '/' + lids.length + ' · 切块池 ' + POOL.length;
        document.getElementById('ldFill').style.width = Math.round(80 + 20 * done / lids.length) + '%';
      }).catch(function () { done++; });
    });
    chain.then(function () {
      document.getElementById('load').style.display = 'none';
      state = 'title';
      if (SEEK > 0 || AUTOPILOT || FORCE_BONUS) setTimeout(startRun, 40);
      rafId = requestAnimationFrame(tick);
    });
  });
}
boot();

window.__COOLRUN = {
  get G() { return G; }, get state() { return state; },
  get seg() { return SEG; }, get pool() { return POOL; },
  start: startRun, bonus: enterBonus, die: function (r) { die(r); }, themes: THEMES
};
if (qs('dump') === '1') {
  setInterval(function () {
    if (!G) { document.title = 'nostate'; return; }
    var p = G.player;
    document.title = JSON.stringify({
      state:state, dead:!!G.dead, deadT:+G.deadT.toFixed(2), reason:G.reason || '',
      x:Math.round(p.x), y:Math.round(p.y), onG:p.onGround, jumps:p.jumps,
      dist:Math.round(G.dist), score:G.score, coins:G.coins, combo:G.combo, dchg:G.dashCharge, dcd:+G.dashCd.toFixed(2),
      energy:+G.energy.toFixed(1), bonus:G.bonus, bonusCount:G.bonusCount,
      theme:curTheme.id, segs:SEG.length, pool:POOL.length, t:+G.t.toFixed(1),
      plan:ai.lastPlan ? ai.lastPlan.t + ':' + ai.lastPlan.d + ':' + ai.lastPlan.w + (ai.lastPlan.needDbl ? ':dbl' : '') + (ai.lastPlan.dash ? ':dash' : '') : '-',
      terrain:(function () {
        var o = '';
        for (var tx = 0; tx <= 1000; tx += 100) {
          var tr = hitSolid(p.x + tx, 0, 2, 900);
          o += (tr ? Math.round(tr.y) : 'X') + ',';
        }
        return o;
      })(),
      trace:ai.trace ? ai.trace.slice(-14) : [],
      jumps:ai.jumps || [],
      segsDetail:SEG.slice(-6).map(function (s2) { return (s2.lv ? s2.lv.id.split('/').pop() : 'start') + ':' + Math.round(s2.x0 / 40) + '-' + Math.round(s2.x1 / 40); }),
      headEnd:Math.round(headX / 40), segN:SEG.length, err:ai.err || ''
    });
  }, 200);
}
})();
</script>
